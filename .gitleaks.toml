title = "ORBIT Gitleaks configuration"

[extend]
useDefault = true

# This exact synthetic workspace-secret fixture is used only in historical tests.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Historical synthetic workspace-secret test fixture only"
  condition = "AND"
  commits = [
    "01ae46532a3292ba228fd88aa3f1b635f8686ad8",
    "58f948be49412567a1a84da9f753b08a21cb531e",
  ]
  paths = ["^server/internal/observability/runtime_test[.]go$"]
  regexes = ["^workspace-secret-123$"]

# This is the public source commit SHA embedded in one published image tag,
# not a credential. Scope the exception to exactly two documentation paths
# and the full immutable tag value; do not exempt other GHCR references.
[[rules.allowlists]]
description = "Public source commit SHA in the immutable Keycloak image tag"
condition = "AND"
paths = ["^deploy/production/keycloak/README[.]md$", "^deploy/production/keycloak/GHCR-PUBLISHING[.]md$"]
regexes = ["^26[.]8[.]2-guava-33[.]7[.]2-c4e45b9c1f0be4fd878c32366c7743a28d079227$"]
