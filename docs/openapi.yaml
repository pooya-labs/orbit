          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: to_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Metadata comparison between the two deployment annotations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentComparisonResponse"
        "400":
          description: The deployments differ in service, are the same deployment, or are not chronological.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or one of the deployment annotations was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deployment annotation storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/deployments/{deploymentID}:
