openapi: 3.1.0
info:
  title: ORBIT API
  version: 0.10.0
  summary: Service inventory and bounded observability query API
  description: |
    ORBIT reads service and incident inventories from PostgreSQL and exposes
    bounded, source-labelled query endpoints for Prometheus metrics, Loki logs,
    and Tempo trace search. The current metrics query is the local demo request counter.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose API
tags:
  - name: Health
  - name: Metadata
  - name: Services
  - name: Incidents
  - name: Alerting
  - name: Telemetry
  - name: Audit
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check required dependency readiness
      responses:
        "200":
          description: PostgreSQL is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: PostgreSQL is not configured or unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/meta:
    get:
      tags: [Metadata]
      operationId: getMetadata
      summary: Read API metadata
      responses:
        "200":
          description: API identity and environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"
  /api/v1/services:
    get:
      tags: [Services]
      operationId: listServices
      summary: List monitored services
      description: Returns at most 500 service records ordered by name.
      responses:
        "200":
          description: Service inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
        "503":
          description: Database or query dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/incidents:
    get:
      tags: [Incidents]
      operationId: listIncidents
      summary: List incidents
      description: Returns at most 500 incidents ordered by start time, newest first.
      parameters:
        - in: query
          name: status
          required: false
          description: Filter by incident lifecycle status.
          schema:
            type: string
            enum: [open, investigating, monitoring, resolved]
      responses:
        "200":
          description: Incident inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
        "400":
          description: Invalid status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database or query dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workspaces/{workspaceID}/audit-events:
    get:
      tags: [Audit]
      operationId: listWorkspaceAuditEvents
      summary: List immutable workspace audit history
      description: Returns the newest audit events for a workspace member. Each event includes a random, workspace-local pseudonymous actor reference and the actor's role captured at insertion time. Raw OIDC issuer and subject identifiers are never returned. Historical events created before actor-context migration 015 are marked with actor_role unknown.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
      responses:
        "200":
          description: Newest immutable audit events for the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAuditEventListResponse"
        "400":
          description: Invalid workspace identifier or limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Workspace audit history is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workspaces/{workspaceID}/incidents:
    get:
      tags: [Incidents]
      operationId: listWorkspaceIncidents
      summary: List incidents in a workspace
      description: Returns at most 500 incidents belonging to the specified workspace. Any workspace member may read the incident inventory.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          required: false
          description: Filter by lifecycle status. Omit to list all statuses.
          schema:
            type: string
            enum: [open, investigating, monitoring, resolved]
      responses:
        "200":
          description: Workspace incident inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
        "400":
          description: Invalid workspace identifier or status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Workspace incident storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Incidents]
      operationId: createWorkspaceIncident
      summary: Create a workspace incident
      description: Creates an incident in the specified workspace. The authenticated principal must be an owner, administrator, or operator in that workspace. Incident creation, its first timeline event, and the workspace audit event commit in one PostgreSQL transaction.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateRequest"
      responses:
        "201":
          description: Incident created with its first immutable timeline event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          description: Invalid request body or incident fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role is not allowed to create incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident storage or a required database dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/incidents/{incidentID}/status:
    patch:
      tags: [Incidents]
      operationId: transitionWorkspaceIncident
      summary: Change an incident status
      description: Applies a validated lifecycle transition. Reopening a resolved incident moves it to investigating. A transition comment, immutable timeline event, and workspace audit event are written atomically with the incident update.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: incidentID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentTransitionRequest"
      responses:
        "200":
          description: Updated incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          description: Invalid request body, status, or identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role is not allowed to change incident status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or incident was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Requested transition is not permitted or the incident already has that status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident storage or a required database dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/incidents/{incidentID}/timeline:
    get:
      tags: [Incidents]
      operationId: listWorkspaceIncidentTimeline
      summary: Read an incident's immutable timeline
      description: Returns at most 100 chronological timeline events. Workspace members may read the timeline; mutation privileges are not required. Timeline records cannot be updated, deleted, or truncated through the database.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: incidentID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          description: Maximum number of latest events to return.
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
      responses:
        "200":
          description: Incident timeline in chronological order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentTimelineResponse"
        "400":
          description: Invalid identifier or page size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or incident was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident timeline storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workspaces/{workspaceID}/incidents:
    post:
      tags: [Incidents]
      operationId: createWorkspaceIncident
      summary: Create an incident in a workspace
      description: Creates an open incident for a service in the same workspace. The incident row, initial immutable timeline event, and workspace audit event commit in one PostgreSQL transaction. Owners, administrators, and operators may create incidents.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incident created with its initial open status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          description: Invalid JSON, request fields, or workspace identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot create incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or same-workspace service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/incidents/{incidentID}/status:
    patch:
      tags: [Incidents]
      operationId: transitionWorkspaceIncident
      summary: Change an incident status
      description: Changes status and appends an immutable timeline event and workspace audit event in one transaction. Allowed transitions are open to investigating, monitoring, or resolved; investigating to monitoring or resolved; monitoring to investigating or resolved; and resolved to investigating (reopen). Reopening clears resolved_at.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: incidentID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionIncidentRequest"
      responses:
        "200":
          description: Incident status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          description: Invalid JSON, status, comment, or identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot mutate incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or incident was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The status transition is invalid or is already the current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/incidents/{incidentID}/timeline:
    get:
      tags: [Incidents]
      operationId: listWorkspaceIncidentTimeline
      summary: Read an incident timeline
      description: Returns immutable events in chronological order. Workspace membership is required.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: incidentID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
      responses:
        "200":
          description: Incident timeline, oldest first within the selected page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentTimelineResponse"
        "400":
          description: Invalid identifiers or page size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or incident was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident timeline storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/alerts:
    get:
      operationId: listWorkspaceAlerts
      summary: List workspace alert instances
      description: Returns persisted alert instances for workspace members. The evaluator processes only the allow-listed request_rate metric. Missing telemetry samples do not resolve existing state.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, firing, resolved, cancelled]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            enum: [10, 25, 50, 100]
      responses:
        '200':
          description: Workspace alert instances
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/workspaces/{workspaceID}/alert-rules:
    get:
      tags: [Alerting]
      operationId: listWorkspaceAlertRules
      summary: List workspace alert rule definitions
      description: Returns workspace-scoped alert rule definitions. The background evaluator processes enabled rules when PostgreSQL and Prometheus are configured. Notification deliveries are created for firing and resolved events when enabled notification channels exist.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
      responses:
        "200":
          description: Workspace alert rule definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleListResponse"
        "400":
          description: Invalid workspace identifier or page size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Alerting]
      operationId: createWorkspaceAlertRule
      summary: Create a workspace alert rule definition
      description: Creates an enabled rule definition. Only request_rate is currently supported because it is the only metric emitted by the instrumented demo workload. No PromQL/LogQL is accepted. Owner, administrator, or operator membership is required. Creation and workspace audit are committed in one transaction. The background evaluator processes enabled rules independently of this request; this endpoint does not send notifications.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleCreateRequest"
      responses:
        "201":
          description: Alert rule definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "400":
          description: Invalid JSON or unsupported alert rule fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot manage alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A rule with the same case-insensitive name already exists in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/alert-rules/{ruleID}:
    put:
      tags: [Alerting]
      operationId: updateWorkspaceAlertRule
      summary: Replace a workspace alert rule definition
      description: Replaces all configurable fields of a rule. Owner, administrator, or operator membership is required. Rule changes and the corresponding immutable workspace audit event are written atomically. Updating a rule does not imply that an evaluator or notification adapter is running.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: ruleID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleUpdateRequest"
      responses:
        "200":
          description: Updated alert rule definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "400":
          description: Invalid JSON, identifiers, or rule fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot manage alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or alert rule was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another rule already uses the requested name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Alerting]
      operationId: deleteWorkspaceAlertRule
      summary: Delete a workspace alert rule definition
      description: Deletes a rule and appends a workspace audit event in the same transaction. The audit record remains after the rule is deleted. Owner, administrator, or operator membership is required.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: ruleID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Alert rule deleted.
        "400":
          description: Invalid workspace or rule identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot manage alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or alert rule was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/alert-rules/{ruleID}/enabled:
    patch:
      tags: [Alerting]
      operationId: setWorkspaceAlertRuleEnabled
      summary: Enable or disable a workspace alert rule definition
      description: Changes the enabled flag and appends a workspace audit event atomically. Active alert instances are closed when the rule is disabled; scheduled evaluation is performed by the background evaluator.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: ruleID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated enabled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "400":
          description: Invalid JSON, workspace, or rule identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot manage alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or alert rule was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The rule already has the requested enabled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workspaces/{workspaceID}/slos:
    get:
      tags: [SLOs]
      operationId: listWorkspaceSLOs
      summary: List workspace service level objectives
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: service_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
      responses:
        "200":
          description: Workspace SLO definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SLOListResponse"
        "400":
          description: Invalid workspace, service, or limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [SLOs]
      operationId: createWorkspaceSLO
      summary: Create a service level objective
      description: Creates an HTTP request-success objective. The service and workspace are verified server-side. Owner, administrator, or operator membership is required. Targets are fractions from 0.90 to 0.9999; rolling windows are limited to 1, 3, or 7 days because the configured Prometheus retention is seven days.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SLOCreateRequest"
      responses:
        "201":
          description: SLO created and audited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SLOResponse"
        "400":
          description: Invalid SLO fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot create SLOs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace or service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An SLO with that name already exists for the service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
