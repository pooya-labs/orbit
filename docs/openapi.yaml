openapi: 3.1.0
info:
  title: ORBIT API
  version: 0.10.0
  summary: Service inventory and bounded observability query API
  description: |
    ORBIT reads service and incident inventories from PostgreSQL and exposes
    bounded, source-labelled query endpoints for Prometheus metrics, Loki logs,
    and Tempo trace search. The current metrics query is the local demo request counter.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose API
tags:
  - name: Health
  - name: Metadata
  - name: Services
  - name: Incidents
  - name: Alerting
  - name: Telemetry
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check required dependency readiness
      responses:
        "200":
          description: PostgreSQL is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: PostgreSQL is not configured or unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/meta:
    get:
      tags: [Metadata]
      operationId: getMetadata
      summary: Read API metadata
      responses:
        "200":
          description: API identity and environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"
  /api/v1/services:
    get:
      tags: [Services]
      operationId: listServices
      summary: List monitored services
      description: Returns at most 500 service records ordered by name.
      responses:
        "200":
          description: Service inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
        "503":
          description: Database or query dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/incidents:
    get:
      tags: [Incidents]
      operationId: listIncidents
      summary: List incidents
      description: Returns at most 500 incidents ordered by start time, newest first.
      parameters:
        - in: query
          name: status
          required: false
          description: Filter by incident lifecycle status.
          schema:
            type: string
            enum: [open, investigating, monitoring, resolved]
      responses:
        "200":
          description: Incident inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
        "400":
          description: Invalid status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database or query dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workspaces/{workspaceID}/incidents:
    get:
      tags: [Incidents]
      operationId: listWorkspaceIncidents
      summary: List incidents in a workspace
      description: Returns at most 500 incidents belonging to the specified workspace. Any workspace member may read the incident inventory.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          required: false
          description: Filter by lifecycle status. Omit to list all statuses.
          schema:
            type: string
            enum: [open, investigating, monitoring, resolved]
      responses:
        "200":
          description: Workspace incident inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
        "400":
          description: Invalid workspace identifier or status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Workspace incident storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Incidents]
      operationId: createWorkspaceIncident
      summary: Create a workspace incident
      description: Creates an incident in the specified workspace. The authenticated principal must be an owner, administrator, or operator in that workspace. Incident creation, its first timeline event, and the workspace audit event commit in one PostgreSQL transaction.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateRequest"
      responses:
        "201":
          description: Incident created with its first immutable timeline event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          description: Invalid request body or incident fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role is not allowed to create incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident storage or a required database dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/incidents/{incidentID}/status:
    patch:
      tags: [Incidents]
      operationId: transitionWorkspaceIncident
      summary: Change an incident status
      description: Applies a validated lifecycle transition. Reopening a resolved incident moves it to investigating. A transition comment, immutable timeline event, and workspace audit event are written atomically with the incident update.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: incidentID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentTransitionRequest"
      responses:
        "200":
          description: Updated incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          description: Invalid request body, status, or identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role is not allowed to change incident status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or incident was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Requested transition is not permitted or the incident already has that status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident storage or a required database dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/incidents/{incidentID}/timeline:
    get:
      tags: [Incidents]
      operationId: listWorkspaceIncidentTimeline
      summary: Read an incident's immutable timeline
      description: Returns at most 100 chronological timeline events. Workspace members may read the timeline; mutation privileges are not required. Timeline records cannot be updated, deleted, or truncated through the database.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: incidentID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          description: Maximum number of latest events to return.
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
      responses:
        "200":
          description: Incident timeline in chronological order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentTimelineResponse"
        "400":
          description: Invalid identifier or page size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or incident was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident timeline storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workspaces/{workspaceID}/incidents:
    post:
      tags: [Incidents]
      operationId: createWorkspaceIncident
      summary: Create an incident in a workspace
      description: Creates an open incident for a service in the same workspace. The incident row, initial immutable timeline event, and workspace audit event commit in one PostgreSQL transaction. Owners, administrators, and operators may create incidents.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incident created with its initial open status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          description: Invalid JSON, request fields, or workspace identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot create incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or same-workspace service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/incidents/{incidentID}/status:
    patch:
      tags: [Incidents]
      operationId: transitionWorkspaceIncident
      summary: Change an incident status
      description: Changes status and appends an immutable timeline event and workspace audit event in one transaction. Allowed transitions are open to investigating, monitoring, or resolved; investigating to monitoring or resolved; monitoring to investigating or resolved; and resolved to investigating (reopen). Reopening clears resolved_at.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: incidentID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionIncidentRequest"
      responses:
        "200":
          description: Incident status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          description: Invalid JSON, status, comment, or identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot mutate incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or incident was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The status transition is invalid or is already the current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/incidents/{incidentID}/timeline:
    get:
      tags: [Incidents]
      operationId: listWorkspaceIncidentTimeline
      summary: Read an incident timeline
      description: Returns immutable events in chronological order. Workspace membership is required.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: incidentID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
      responses:
        "200":
          description: Incident timeline, oldest first within the selected page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentTimelineResponse"
        "400":
          description: Invalid identifiers or page size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or incident was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Incident timeline storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/alerts:
    get:
      operationId: listWorkspaceAlerts
      summary: List workspace alert instances
      description: Returns persisted alert instances for workspace members. The evaluator processes only the allow-listed request_rate metric. Missing telemetry samples do not resolve existing state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, firing, resolved, cancelled]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            enum: [10, 25, 50, 100]
      responses:
        '200':
          description: Workspace alert instances
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/workspaces/{workspaceID}/alert-rules:
    get:
      tags: [Alerting]
      operationId: listWorkspaceAlertRules
      summary: List workspace alert rule definitions
      description: Returns alert rule definitions for a workspace member. Rules are definitions only in this API slice; periodic evaluation and notification delivery are not yet implemented.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
      responses:
        "200":
          description: Workspace alert rule definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleListResponse"
        "400":
          description: Invalid workspace identifier or page size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Alerting]
      operationId: createWorkspaceAlertRule
      summary: Create a workspace alert rule definition
      description: Creates an enabled rule definition. Only request_rate is currently supported because it is the only metric emitted by the instrumented demo workload. No PromQL/LogQL is accepted. Owner, administrator, or operator membership is required. Creation and workspace audit are committed in one transaction. This endpoint does not start an evaluator or send notifications.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleCreateRequest"
      responses:
        "201":
          description: Alert rule definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "400":
          description: Invalid JSON or unsupported alert rule fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot manage alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A rule with the same case-insensitive name already exists in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/alert-rules/{ruleID}:
    put:
      tags: [Alerting]
      operationId: updateWorkspaceAlertRule
      summary: Replace a workspace alert rule definition
      description: Replaces all configurable fields of a rule. Owner, administrator, or operator membership is required. Rule changes and the corresponding immutable workspace audit event are written atomically. Updating a rule does not imply that an evaluator or notification adapter is running.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: ruleID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleUpdateRequest"
      responses:
        "200":
          description: Updated alert rule definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "400":
          description: Invalid JSON, identifiers, or rule fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot manage alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or alert rule was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another rule already uses the requested name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Alerting]
      operationId: deleteWorkspaceAlertRule
      summary: Delete a workspace alert rule definition
      description: Deletes a rule and appends a workspace audit event in the same transaction. The audit record remains after the rule is deleted. Owner, administrator, or operator membership is required.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: ruleID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Alert rule deleted.
        "400":
          description: Invalid workspace or rule identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot manage alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or alert rule was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/alert-rules/{ruleID}/enabled:
    patch:
      tags: [Alerting]
      operationId: setWorkspaceAlertRuleEnabled
      summary: Enable or disable a workspace alert rule definition
      description: Changes the enabled flag and appends a workspace audit event atomically. This controls stored rule configuration only; scheduled evaluation is not part of this API slice.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: ruleID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated enabled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "400":
          description: Invalid JSON, workspace, or rule identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot manage alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace membership or alert rule was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The rule already has the requested enabled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Alert rule storage or transactional audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/telemetry/services:
    get:
      tags: [Telemetry]
      operationId: discoverTelemetryServices
      summary: Discover service names across configured telemetry backends
      description: Queries Prometheus, Loki, and Tempo concurrently, merges duplicate service names, and, when PostgreSQL is configured, persists observations and backend provenance before returning the active catalog. Services and source observations not seen for seven days are omitted. If every backend is unavailable, the API returns the last known PostgreSQL catalog with a warning when cached services exist. Without PostgreSQL, the response contains the current discovery result and a warning. Partial backend failures are returned as warnings when at least one backend succeeds.
      parameters:
        - in: query
          name: window
          required: false
          description: Discovery time window. Defaults to 1h.
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: limit
          required: false
          description: Maximum number of services to return. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          required: false
          description: URL-safe continuation token returned by the previous page.
          schema:
            type: string
      responses:
        "200":
          description: Discovered services and their source backends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryServicesResponse"
        "400":
          description: Unsupported time window, invalid page size, or malformed continuation cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: All telemetry backends are unavailable, or PostgreSQL catalog persistence/querying failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/services/{service}/attributes:
    get:
      tags: [Telemetry]
      operationId: getTelemetryServiceResourceAttributes
      summary: Discover resource attributes for one telemetry service
      description: Queries service-scoped series labels and resource tags from configured telemetry backends. Values are bounded, merged, and returned with backend provenance; supported labels are normalized into OpenTelemetry-style attribute names.
      parameters:
        - in: path
          name: service
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
      responses:
        "200":
          description: Resource attributes and the backends that reported each attribute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryResourceAttributesResponse"
        "400":
          description: Invalid service identifier or time window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The requested service is not present in the persisted telemetry catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No configured telemetry backend can provide resource attributes, or persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/metrics:
    get:
      tags: [Telemetry]
      operationId: queryTelemetryMetrics
      summary: Query the bounded ORBIT demo request-rate metric
      description: Runs a fixed PromQL expression. Arbitrary PromQL is not accepted.
      parameters:
        - in: query
          name: window
          required: false
          description: Maximum query window. Defaults to 1h.
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: service
          required: false
          description: Safe service identifier used to scope the request-rate series.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
            default: orbit-telemetry-demo
        - in: query
          name: group_by
          required: false
          description: Comma-separated allow-list of grouping labels. Use none for one aggregate series; arbitrary PromQL is never accepted.
          schema:
            type: string
            default: instance,service_version,deployment_environment
            pattern: "^(none|((instance|job|service_version|deployment_environment|container_name|host_name|cloud_region)(,(instance|job|service_version|deployment_environment|container_name|host_name|cloud_region))*))$"
      responses:
        "200":
          description: Prometheus range query result with source and query timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryMetricsResponse"
        "400":
          description: Unsupported time window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Prometheus is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/logs:
    get:
      tags: [Telemetry]
      operationId: queryTelemetryLogs
      summary: Query recent logs for a service
      description: Uses a bounded LogQL service selector. Arbitrary LogQL is not accepted.
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: service
          required: false
          description: Safe service identifier. Defaults to orbit-telemetry-demo.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
            default: orbit-telemetry-demo
        - in: query
          name: limit
          required: false
          description: Maximum number of returned log entries.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Loki log streams with source and query timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryLogsResponse"
        "400":
          description: Invalid query window, service name, or result limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Loki is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/traces:
    get:
      tags: [Telemetry]
      operationId: queryTelemetryTraces
      summary: Search traces for a service
      description: Uses a bounded Tempo service.name tag search.
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: service
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
            default: orbit-telemetry-demo
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Tempo trace summaries with source and query timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryTracesResponse"
        "400":
          description: Invalid query window, service name, or result limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Tempo is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:

    CreateIncidentRequest:
      type: object
      additionalProperties: false
      required: [title, service_id, severity]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 8000
        service_id:
          type: string
          format: uuid
        severity:
          type: string
          enum: [critical, high, medium, low]
    TransitionIncidentRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        comment:
          type: string
          maxLength: 4000
    IncidentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Incident"
    IncidentTimelineEvent:
      type: object
      required: [id, workspace_id, incident_id, event_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [incident.created, incident.status_changed, incident.reopened]
        from_status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        to_status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        comment:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    IncidentTimelineResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IncidentTimelineEvent"
    AlertRuleCreateRequest:
      type: object
      additionalProperties: false
      required: [name, metric, operator, threshold, window_seconds, pending_seconds, severity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
          default: ""
        service_name:
          type: string
          maxLength: 128
          description: Optional service filter. Empty means all services in the workspace.
        metric:
          type: string
          const: request_rate
          description: The only metric supported by the current instrumented workload.
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        threshold:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000
          description: Request rate threshold in requests per second.
        window_seconds:
          type: integer
          enum: [60, 300, 900]
        pending_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: Intended sustained-breach duration before firing; it is stored as configuration and is not evaluated by this API slice.
        severity:
          type: string
          enum: [critical, high, medium, low]
    AlertRuleUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/AlertRuleCreateRequest"
    AlertInstance:
      type: object
      required: [id, workspace_id, alert_rule_id, rule_name, service_name, metric, operator, threshold, window_seconds, pending_seconds, severity, status, value, pending_since, last_evaluated_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        alert_rule_id: { type: string, format: uuid }
        rule_name: { type: string }
        service_name: { type: string }
        metric: { type: string, enum: [request_rate] }
        operator: { type: string, enum: [gt, gte, lt, lte] }
        threshold: { type: number }
        window_seconds: { type: integer, enum: [60, 300, 900] }
        pending_seconds: { type: integer, minimum: 0, maximum: 3600 }
        severity: { type: string, enum: [critical, high, medium, low] }
        status: { type: string, enum: [pending, firing, resolved, cancelled] }
        value: { type: number, minimum: 0 }
        pending_since: { type: string, format: date-time }
        fired_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        last_evaluated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertRule:
      type: object
      required: [id, workspace_id, name, description, metric, operator, threshold, window_seconds, pending_seconds, severity, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        service_name:
          type: string
        metric:
          type: string
          const: request_rate
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        threshold:
          type: number
        window_seconds:
          type: integer
          enum: [60, 300, 900]
        pending_seconds:
          type: integer
          minimum: 0
          maximum: 3600
        severity:
          type: string
          enum: [critical, high, medium, low]
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertRuleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AlertRule"
    AlertRuleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AlertRule"
    TelemetryQueryMeta:
      type: object
      required: [window, queried_at]
      properties:
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        service:
          type: string
        limit:
          type: integer
    TelemetryServicesResponse:
      type: object
      required: [source, window, queried_at, sources_queried, has_more, data]
      properties:
        source:
          type: string
          enum: [telemetry_backends, postgres_catalog]
          description: postgres_catalog indicates a last-known-data fallback while all telemetry backends are unavailable.
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        sources_queried:
          type: array
          items:
            type: string
            enum: [prometheus, loki, tempo]
        warnings:
          type: array
          items:
            type: string
        next_cursor:
          type: string
          description: URL-safe continuation token for the next catalog page; omitted when no page remains.
        has_more:
          type: boolean
        data:
          type: array
          items:
            type: object
            required: [name, sources]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
              sources:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [prometheus, loki, tempo]
              first_seen_at:
                type: string
                format: date-time
              last_seen_at:
                type: string
                format: date-time
              last_discovered_at:
                type: string
                format: date-time
              resource_attributes:
                type: object
                additionalProperties: true
              resource_attribute_sources:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                    enum: [prometheus, loki, tempo]
    TelemetryResourceAttributesResponse:
      type: object
      required: [service, window, queried_at, sources_queried, attributes, attribute_sources]
      properties:
        service:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        sources_queried:
          type: array
          items:
            type: string
            enum: [prometheus, loki, tempo]
        warnings:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
        attribute_sources:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum: [prometheus, loki, tempo]
    TelemetryMetricsResponse:
      type: object
      required: [source, window, queried_at, query, step, data]
      properties:
        source:
          type: string
          const: prometheus
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        query:
          type: string
          description: Fixed service-scoped PromQL expression.
        step:
          type: string
        group_by:
          type: array
          items:
            type: string
            enum: [instance, job, service_version, deployment_environment, container_name, host_name, cloud_region]
        data:
          type: array
          items:
            type: object
            required: [metric, values]
            properties:
              metric:
                type: object
                additionalProperties:
                  type: string
              values:
                type: array
                items:
                  type: array
                  prefixItems:
                    - type: number
                    - type: string
                  minItems: 2
                  maxItems: 2
    TelemetryLogsResponse:
      type: object
      required: [source, window, queried_at, query, service, limit, data]
      properties:
        source:
          type: string
          const: loki
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        query:
          type: string
        service:
          type: string
        limit:
          type: integer
        data:
          type: array
          items:
            type: object
            required: [stream, values]
            properties:
              stream:
                type: object
                additionalProperties:
                  type: string
              values:
                type: array
                items:
                  type: array
                  prefixItems:
                    - type: string
                    - type: string
                  minItems: 2
                  maxItems: 2
    TelemetryTracesResponse:
      type: object
      required: [source, window, queried_at, query, service, limit, data]
      properties:
        source:
          type: string
          const: tempo
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        query:
          type: string
        service:
          type: string
        limit:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              traceID:
                type: string
              rootServiceName:
                type: string
              rootTraceName:
                type: string
              startTimeUnixNano:
                type: string
              durationMs:
                type: number

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok, ready]
    MetadataResponse:
      type: object
      required: [name, version, environment]
      properties:
        name:
          type: string
          const: orbit-api
        version:
          type: string
        environment:
          type: string
    Service:
      type: object
      required: [id, name, description, environment, region, status, source]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        environment:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [operational, degraded, incident, unknown]
        latency_p95_ms:
          type: [number, "null"]
          minimum: 0
        error_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Decimal fraction (0.01 means one percent).
        last_seen_at:
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [demo_seed, live]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Incident:
      type: object
      required: [id, title, description, service_id, service_name, severity, status, started_at, updated_at, source]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        service_id:
          type: string
          format: uuid
        service_name:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [demo_seed, live, api]
    IncidentCreateRequest:
      type: object
      additionalProperties: false
      required: [title, service_id, severity]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 8000
          default: ""
        service_id:
          type: string
          format: uuid
        severity:
          type: string
          enum: [critical, high, medium, low]
    IncidentTransitionRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        comment:
          type: string
          maxLength: 4000
          default: ""
    IncidentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Incident"
    IncidentTimelineEvent:
      type: object
      required: [id, workspace_id, incident_id, event_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [incident.created, incident.status_changed, incident.reopened]
        from_status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        to_status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        comment:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    IncidentTimelineResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IncidentTimelineEvent"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
