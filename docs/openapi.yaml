openapi: 3.1.0
info:
  title: ORBIT API
  version: 0.6.0
  summary: Service inventory and bounded observability query API
  description: |
    ORBIT reads service and incident inventories from PostgreSQL and exposes
    bounded, source-labelled query endpoints for Prometheus metrics, Loki logs,
    and Tempo trace search. The current metrics query is the local demo request counter.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose API
tags:
  - name: Health
  - name: Metadata
  - name: Services
  - name: Incidents
  - name: Telemetry
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check required dependency readiness
      responses:
        "200":
          description: PostgreSQL is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: PostgreSQL is not configured or unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/meta:
    get:
      tags: [Metadata]
      operationId: getMetadata
      summary: Read API metadata
      responses:
        "200":
          description: API identity and environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"
  /api/v1/services:
    get:
      tags: [Services]
      operationId: listServices
      summary: List monitored services
      description: Returns at most 500 service records ordered by name.
      responses:
        "200":
          description: Service inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
        "503":
          description: Database or query dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/incidents:
    get:
      tags: [Incidents]
      operationId: listIncidents
      summary: List incidents
      description: Returns at most 500 incidents ordered by start time, newest first.
      parameters:
        - in: query
          name: status
          required: false
          description: Filter by incident lifecycle status.
          schema:
            type: string
            enum: [open, investigating, monitoring, resolved]
      responses:
        "200":
          description: Incident inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
        "400":
          description: Invalid status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database or query dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/telemetry/metrics:
    get:
      tags: [Telemetry]
      operationId: queryTelemetryMetrics
      summary: Query the bounded ORBIT demo request-rate metric
      description: Runs a fixed PromQL expression. Arbitrary PromQL is not accepted.
      parameters:
        - in: query
          name: window
          required: false
          description: Maximum query window. Defaults to 1h.
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
      responses:
        "200":
          description: Prometheus range query result with source and query timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryMetricsResponse"
        "400":
          description: Unsupported time window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Prometheus is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/logs:
    get:
      tags: [Telemetry]
      operationId: queryTelemetryLogs
      summary: Query recent logs for a service
      description: Uses a bounded LogQL service selector. Arbitrary LogQL is not accepted.
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: service
          required: false
          description: Safe service identifier. Defaults to orbit-telemetry-demo.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
            default: orbit-telemetry-demo
        - in: query
          name: limit
          required: false
          description: Maximum number of returned log entries.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Loki log streams with source and query timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryLogsResponse"
        "400":
          description: Invalid query window, service name, or result limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Loki is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/traces:
    get:
      tags: [Telemetry]
      operationId: queryTelemetryTraces
      summary: Search traces for a service
      description: Uses a bounded Tempo service.name tag search.
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: service
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
            default: orbit-telemetry-demo
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Tempo trace summaries with source and query timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryTracesResponse"
        "400":
          description: Invalid query window, service name, or result limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Tempo is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:

    TelemetryQueryMeta:
      type: object
      required: [window, queried_at]
      properties:
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        service:
          type: string
        limit:
          type: integer
    TelemetryMetricsResponse:
      type: object
      required: [source, window, queried_at, query, step, data]
      properties:
        source:
          type: string
          const: prometheus
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        query:
          type: string
          const: "sum(rate(orbit_demo_requests_total[5m]))"
        step:
          type: string
        data:
          type: array
          items:
            type: object
            required: [metric, values]
            properties:
              metric:
                type: object
                additionalProperties:
                  type: string
              values:
                type: array
                items:
                  type: array
                  prefixItems:
                    - type: number
                    - type: string
                  minItems: 2
                  maxItems: 2
    TelemetryLogsResponse:
      type: object
      required: [source, window, queried_at, query, service, limit, data]
      properties:
        source:
          type: string
          const: loki
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        query:
          type: string
        service:
          type: string
        limit:
          type: integer
        data:
          type: array
          items:
            type: object
            required: [stream, values]
            properties:
              stream:
                type: object
                additionalProperties:
                  type: string
              values:
                type: array
                items:
                  type: array
                  prefixItems:
                    - type: string
                    - type: string
                  minItems: 2
                  maxItems: 2
    TelemetryTracesResponse:
      type: object
      required: [source, window, queried_at, query, service, limit, data]
      properties:
        source:
          type: string
          const: tempo
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        query:
          type: string
        service:
          type: string
        limit:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              traceID:
                type: string
              rootServiceName:
                type: string
              rootTraceName:
                type: string
              startTimeUnixNano:
                type: string
              durationMs:
                type: number

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok, ready]
    MetadataResponse:
      type: object
      required: [name, version, environment]
      properties:
        name:
          type: string
          const: orbit-api
        version:
          type: string
        environment:
          type: string
    Service:
      type: object
      required: [id, name, description, environment, region, status, source]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        environment:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [operational, degraded, incident, unknown]
        latency_p95_ms:
          type: [number, "null"]
          minimum: 0
        error_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Decimal fraction (0.01 means one percent).
        last_seen_at:
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [demo_seed, live]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Incident:
      type: object
      required: [id, title, description, service_id, service_name, severity, status, started_at, updated_at, source]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        service_id:
          type: string
          format: uuid
        service_name:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [demo_seed, live]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
