      description: Creates an immutable deployment annotation for a service in the specified workspace. The environment and service name are derived from the service record, never accepted from the caller. The authenticated actor, annotation, and workspace audit event are recorded transactionally. Owner, administrator, or operator membership is required.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspaceID
          required: true
