        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/telemetry/services:
    get:
      tags: [Telemetry]
      operationId: discoverTelemetryServices
      summary: Discover service names across configured telemetry backends
      description: Queries Prometheus, Loki, and Tempo concurrently, merges duplicate service names, and, when PostgreSQL is configured, persists observations and backend provenance before returning the active catalog. Services and source observations not seen for seven days are omitted. If every backend is unavailable, the API returns the last known PostgreSQL catalog with a warning when cached services exist. Without PostgreSQL, the response contains the current discovery result and a warning. Partial backend failures are returned as warnings when at least one backend succeeds.
      parameters:
        - in: query
          name: window
          required: false
          description: Discovery time window. Defaults to 1h.
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: limit
          required: false
          description: Maximum number of services to return. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          required: false
          description: URL-safe continuation token returned by the previous page.
          schema:
            type: string
      responses:
        "200":
          description: Discovered services and their source backends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryServicesResponse"
        "400":
          description: Unsupported time window, invalid page size, or malformed continuation cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: All telemetry backends are unavailable, or PostgreSQL catalog persistence/querying failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/services/{service}/attributes:
    get:
      tags: [Telemetry]
      operationId: getTelemetryServiceResourceAttributes
      summary: Discover resource attributes for one telemetry service
      description: Queries service-scoped series labels and resource tags from configured telemetry backends. Values are bounded, merged, and returned with backend provenance; supported labels are normalized into OpenTelemetry-style attribute names.
      parameters:
        - in: path
          name: service
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
      responses:
        "200":
          description: Resource attributes and the backends that reported each attribute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryResourceAttributesResponse"
        "400":
          description: Invalid service identifier or time window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The requested service is not present in the persisted telemetry catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No configured telemetry backend can provide resource attributes, or persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/metrics:
    get:
      tags: [Telemetry]
      operationId: queryTelemetryMetrics
      summary: Query the bounded ORBIT demo request-rate metric
      description: Runs a fixed PromQL expression. Arbitrary PromQL is not accepted.
      parameters:
        - in: query
          name: window
          required: false
          description: Maximum query window. Defaults to 1h.
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: service
          required: false
          description: Safe service identifier used to scope the request-rate series.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
            default: orbit-telemetry-demo
        - in: query
          name: group_by
          required: false
          description: Comma-separated allow-list of grouping labels. Use none for one aggregate series; arbitrary PromQL is never accepted.
          schema:
            type: string
            default: instance,service_version,deployment_environment
            pattern: "^(none|((instance|job|service_version|deployment_environment|container_name|host_name|cloud_region)(,(instance|job|service_version|deployment_environment|container_name|host_name|cloud_region))*))$"
      responses:
        "200":
          description: Prometheus range query result with source and query timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryMetricsResponse"
        "400":
          description: Unsupported time window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Prometheus is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/logs:
    get:
      tags: [Telemetry]
      operationId: queryTelemetryLogs
      summary: Query recent logs for a service
      description: Uses a bounded LogQL service selector. Arbitrary LogQL is not accepted.
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: service
          required: false
          description: Safe service identifier. Defaults to orbit-telemetry-demo.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
            default: orbit-telemetry-demo
        - in: query
          name: limit
          required: false
          description: Maximum number of returned log entries.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Loki log streams with source and query timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryLogsResponse"
        "400":
          description: Invalid query window, service name, or result limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Loki is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/telemetry/traces:
    get:
      tags: [Telemetry]
      operationId: queryTelemetryTraces
      summary: Search traces for a service
      description: Uses a bounded Tempo service.name tag search.
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [15m, 1h, 6h, 24h]
            default: 1h
        - in: query
          name: service
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
            default: orbit-telemetry-demo
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Tempo trace summaries with source and query timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryTracesResponse"
        "400":
          description: Invalid query window, service name, or result limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Tempo is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      description: Workspace UUID scoped to the authenticated principal.
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: The workspace or requested workspace resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: The workspace dependency or storage service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:

    CreateIncidentRequest:
      type: object
      additionalProperties: false
      required: [title, service_id, severity]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 8000
        service_id:
          type: string
          format: uuid
        severity:
          type: string
          enum: [critical, high, medium, low]
    TransitionIncidentRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        comment:
          type: string
          maxLength: 4000
    IncidentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Incident"
    IncidentTimelineEvent:
      type: object
      required: [id, workspace_id, incident_id, event_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [incident.created, incident.status_changed, incident.reopened]
        from_status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        to_status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        comment:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    IncidentTimelineResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IncidentTimelineEvent"
    AlertRuleCreateRequest:
      type: object
      additionalProperties: false
      required: [name, metric, operator, threshold, window_seconds, pending_seconds, severity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
          default: ""
        service_name:
          type: string
          maxLength: 128
          description: Optional service filter. Empty means all services in the workspace.
        metric:
          type: string
          const: request_rate
          description: The only metric supported by the current instrumented workload.
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        threshold:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000
          description: Request rate threshold in requests per second.
        window_seconds:
          type: integer
          enum: [60, 300, 900]
        pending_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: Intended sustained-breach duration before firing; the background evaluator applies this duration and resets it after a telemetry observation gap.
        severity:
          type: string
          enum: [critical, high, medium, low]
    AlertRuleUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/AlertRuleCreateRequest"
    AlertInstance:
      type: object
      required: [id, workspace_id, alert_rule_id, rule_name, service_name, metric, operator, threshold, window_seconds, pending_seconds, severity, status, value, pending_since, last_evaluated_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        alert_rule_id: { type: string, format: uuid }
        rule_name: { type: string }
        service_name: { type: string }
        metric: { type: string, enum: [request_rate] }
        operator: { type: string, enum: [gt, gte, lt, lte] }
        threshold: { type: number }
        window_seconds: { type: integer, enum: [60, 300, 900] }
        pending_seconds: { type: integer, minimum: 0, maximum: 3600 }
        severity: { type: string, enum: [critical, high, medium, low] }
        status: { type: string, enum: [pending, firing, resolved, cancelled] }
        value: { type: number, minimum: 0 }
        pending_since: { type: string, format: date-time }
        fired_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        last_evaluated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertRule:
      type: object
      required: [id, workspace_id, name, description, metric, operator, threshold, window_seconds, pending_seconds, severity, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        service_name:
          type: string
        metric:
          type: string
          const: request_rate
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        threshold:
          type: number
        window_seconds:
          type: integer
          enum: [60, 300, 900]
        pending_seconds:
          type: integer
          minimum: 0
          maximum: 3600
        severity:
          type: string
          enum: [critical, high, medium, low]
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertRuleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AlertRule"
    AlertRuleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AlertRule"
    AlertNotificationChannelCreateRequest:
      type: object
      additionalProperties: false
      required: [name, secret_ref]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        secret_ref:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
          description: Reference to an API deployment secret. The endpoint URL and credential are never accepted by this API.
    AlertNotificationChannel:
      type: object
      required: [id, workspace_id, name, adapter, enabled, secret_configured, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        adapter: { type: string, enum: [webhook] }
        enabled: { type: boolean }
        secret_configured:
          type: boolean
          description: Whether the API process currently has the referenced deployment secret. The reference itself is never returned.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertNotificationChannelResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AlertNotificationChannel"
    AlertNotificationChannelListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AlertNotificationChannel"
    AlertNotificationDelivery:
      type: object
      required: [id, workspace_id, alert_instance_id, event_id, channel_id, channel_name, event_type, status, attempts, next_attempt_at, created_at, updated_at, rule_name, service_name, metric, operator, threshold, value, severity, instance_status, occurred_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        alert_instance_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        event_type: { type: string, enum: [alert.firing, alert.resolved] }
        status: { type: string, enum: [pending, processing, delivered, dead] }
        attempts: { type: integer, minimum: 0, maximum: 8 }
        next_attempt_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        last_error:
          type: string
          description: Safe error code only; response bodies and destination credentials are never persisted here.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        rule_name: { type: string }
        service_name: { type: string }
        metric: { type: string, enum: [request_rate] }
        operator: { type: string, enum: [gt, gte, lt, lte] }
        threshold: { type: number }
        value: { type: number }
        severity: { type: string, enum: [critical, high, medium, low] }
        instance_status: { type: string, enum: [pending, firing, resolved, cancelled] }
        occurred_at: { type: string, format: date-time }
    AlertNotificationDeliveryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AlertNotificationDelivery"
    AlertNotificationAttempt:
      type: object
      required: [id, delivery_id, attempt_number, outcome, attempted_at]
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        attempt_number: { type: integer, minimum: 1, maximum: 8 }
        outcome: { type: string, enum: [delivered, retry_scheduled, dead] }
        http_status: { type: integer, minimum: 100, maximum: 599, nullable: true }
        error_code: { type: string, description: Safe error code only. }
        attempted_at: { type: string, format: date-time }
    SLOCreateRequest:
      type: object
      additionalProperties: false
      required: [service_id, name, route, target, rolling_window_days]
      properties:
        service_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        route:
          type: string
          minLength: 2
          maxLength: 128
          pattern: "^/[A-Za-z0-9][A-Za-z0-9/_-]{0,127}$"
          description: A normalized, low-cardinality instrumented HTTP route.
        target:
          type: number
          minimum: 0.9
          maximum: 0.9999
          description: Fractional request-success target (0.99 = 99%).
        rolling_window_days:
          type: integer
          enum: [1, 3, 7]
    SLOUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, route, target, rolling_window_days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        route:
          type: string
          minLength: 2
          maxLength: 128
          pattern: "^/[A-Za-z0-9][A-Za-z0-9/_-]{0,127}$"
        target:
          type: number
          minimum: 0.9
          maximum: 0.9999
        rolling_window_days:
          type: integer
          enum: [1, 3, 7]
    ServiceLevelObjective:
      type: object
      required: [id, workspace_id, service_id, service_name, environment, name, route, target, rolling_window_days, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        service_name:
          type: string
        environment:
          type: string
        name:
          type: string
        route:
          type: string
        target:
          type: number
        rolling_window_days:
          type: integer
          enum: [1, 3, 7]
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SLOResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ServiceLevelObjective"
    SLOListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServiceLevelObjective"
    SLOAvailabilityBudget:
      type: object
      required: [status, target, good_events, bad_events, total_events]
      properties:
        status:
          type: string
          enum: [insufficient_data, within_budget, exhausted]
        target:
          type: number
        good_events:
          type: number
        bad_events:
          type: number
        total_events:
          type: number
        availability:
          type: number
        allowed_bad_events:
          type: number
        remaining_bad_events:
          type: number
        budget_consumed_percent:
          type: number
        budget_remaining_percent:
          type: number
        burn_rate:
          type: number
    SLOBudgetResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [objective, sli, valid_event_policy, window_start, window_end, budget]
          properties:
            objective:
              $ref: "#/components/schemas/ServiceLevelObjective"
            sli:
              type: string
              const: http_request_success_rate
            valid_event_policy:
              type: string
            window_start:
              type: string
              format: date-time
            window_end:
              type: string
              format: date-time
            budget:
              $ref: "#/components/schemas/SLOAvailabilityBudget"
    DeploymentAnnotationCreateRequest:
      type: object
      additionalProperties: false
      required: [service_id, version]
      properties:
        service_id:
          type: string
          format: uuid
        version:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9.+_:/-]{0,127}$"
        commit_sha:
          type: string
          maxLength: 64
          pattern: "^[0-9a-fA-F]{7,64}$"
        change_reference:
          type: string
          maxLength: 256
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/#-]{0,255}$"
        release_notes:
          type: string
          maxLength: 4000
        deployed_at:
          type: string
          format: date-time
    DeploymentAnnotation:
      type: object
      required: [id, workspace_id, service_id, service_name, environment, version, deployed_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        service_name:
          type: string
        environment:
          type: string
        version:
          type: string
        commit_sha:
          type: string
        change_reference:
          type: string
        release_notes:
          type: string
        deployed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    DeploymentAnnotationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DeploymentAnnotation"
    DeploymentAnnotationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentAnnotation"
    DeploymentComparisonResponse:
      type: object
      required: [from, to, elapsed_seconds, version_changed, commit_changed]
      properties:
        from:
          $ref: "#/components/schemas/DeploymentAnnotation"
        to:
          $ref: "#/components/schemas/DeploymentAnnotation"
        elapsed_seconds:
          type: integer
          format: int64
          minimum: 0
        version_changed:
          type: boolean
        commit_changed:
          type: boolean
    AlertNotificationAttemptListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AlertNotificationAttempt"
    TelemetryQueryMeta:
      type: object
      required: [window, queried_at]
      properties:
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        service:
          type: string
        limit:
          type: integer
    TelemetryServicesResponse:
      type: object
      required: [source, window, queried_at, sources_queried, has_more, data]
      properties:
        source:
          type: string
          enum: [telemetry_backends, postgres_catalog]
          description: postgres_catalog indicates a last-known-data fallback while all telemetry backends are unavailable.
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        sources_queried:
          type: array
          items:
            type: string
            enum: [prometheus, loki, tempo]
        warnings:
          type: array
          items:
            type: string
        next_cursor:
          type: string
          description: URL-safe continuation token for the next catalog page; omitted when no page remains.
        has_more:
          type: boolean
        data:
          type: array
          items:
            type: object
            required: [name, sources]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
              sources:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [prometheus, loki, tempo]
              first_seen_at:
                type: string
                format: date-time
              last_seen_at:
                type: string
                format: date-time
              last_discovered_at:
                type: string
                format: date-time
              resource_attributes:
                type: object
                additionalProperties: true
              resource_attribute_sources:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                    enum: [prometheus, loki, tempo]
    TelemetryResourceAttributesResponse:
      type: object
      required: [service, window, queried_at, sources_queried, attributes, attribute_sources]
      properties:
        service:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        sources_queried:
          type: array
          items:
            type: string
            enum: [prometheus, loki, tempo]
        warnings:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
        attribute_sources:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum: [prometheus, loki, tempo]
    TelemetryMetricsResponse:
      type: object
      required: [source, window, queried_at, query, step, data]
      properties:
        source:
          type: string
          const: prometheus
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        query:
          type: string
          description: Fixed service-scoped PromQL expression.
        step:
          type: string
        group_by:
          type: array
          items:
            type: string
            enum: [instance, job, service_version, deployment_environment, container_name, host_name, cloud_region]
        data:
          type: array
          items:
            type: object
            required: [metric, values]
            properties:
              metric:
                type: object
                additionalProperties:
                  type: string
              values:
                type: array
                items:
                  type: array
                  prefixItems:
                    - type: number
                    - type: string
                  minItems: 2
                  maxItems: 2
    TelemetryLogsResponse:
      type: object
      required: [source, window, queried_at, query, service, limit, data]
      properties:
        source:
          type: string
          const: loki
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        query:
          type: string
        service:
          type: string
        limit:
          type: integer
        data:
          type: array
          items:
            type: object
            required: [stream, values]
            properties:
              stream:
                type: object
                additionalProperties:
                  type: string
              values:
                type: array
                items:
                  type: array
                  prefixItems:
                    - type: string
                    - type: string
                  minItems: 2
                  maxItems: 2
    TelemetryTracesResponse:
      type: object
      required: [source, window, queried_at, query, service, limit, data]
      properties:
        source:
          type: string
          const: tempo
        window:
          type: string
          enum: [15m, 1h, 6h, 24h]
        queried_at:
          type: string
          format: date-time
        query:
          type: string
        service:
          type: string
        limit:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              traceID:
                type: string
              rootServiceName:
                type: string
              rootTraceName:
                type: string
              startTimeUnixNano:
                type: string
              durationMs:
                type: number

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok, ready]
    MetadataResponse:
      type: object
      required: [name, version, environment]
      properties:
        name:
          type: string
          const: orbit-api
        version:
          type: string
        environment:
          type: string
    Service:
      type: object
      required: [id, name, description, environment, region, status, source]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        environment:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [operational, degraded, incident, unknown]
        latency_p95_ms:
          type: [number, "null"]
          minimum: 0
        error_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Decimal fraction (0.01 means one percent).
        last_seen_at:
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [demo_seed, live]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Incident:
      type: object
      required: [id, title, description, service_id, service_name, severity, status, started_at, updated_at, source]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        service_id:
          type: string
          format: uuid
        service_name:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [demo_seed, live, api]
    IncidentCreateRequest:
      type: object
      additionalProperties: false
      required: [title, service_id, severity]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 8000
          default: ""
        service_id:
          type: string
          format: uuid
        severity:
          type: string
          enum: [critical, high, medium, low]
    IncidentTransitionRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        comment:
          type: string
          maxLength: 4000
          default: ""
    IncidentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Incident"
    IncidentTimelineEvent:
      type: object
      required: [id, workspace_id, incident_id, event_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        event_type:
          type: string
