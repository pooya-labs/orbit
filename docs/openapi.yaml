  /api/v1/workspaces/{workspaceID}/deployments:
    get:
      tags: [Deployments]
      operationId: listWorkspaceDeploymentAnnotations
      summary: List workspace deployment annotations
      description: Lists immutable deployment annotations for workspace members, optionally filtered to one service. Deployment metadata is historical; it is not proof that a deployment caused a telemetry change.
