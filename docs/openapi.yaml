  /api/v1/workspaces/{workspaceID}/slos/{sloID}/budget:
    get:
      tags: [SLOs]
      operationId: getWorkspaceSLOBudget
      summary: Calculate the rolling request-success error budget
      description: Uses fixed PromQL selectors for the workspace, service, route and good/bad outcome labels. 2xx/3xx instrumented responses are good; all other instrumented responses are bad. If no observations exist, status is insufficient_data and availability is omitted rather than reported as 100 percent. Unscoped telemetry is never used.
      security:
