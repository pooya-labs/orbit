openapi: 3.1.0
info:
  title: ORBIT API
  version: 0.2.0
  summary: Service health and incident inventory API
  description: |
    Initial ORBIT read API. Service and incident records currently come from
    explicitly labelled demo seed rows until telemetry ingestion is implemented.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose API
tags:
  - name: Health
  - name: Metadata
  - name: Services
  - name: Incidents
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check required dependency readiness
      responses:
        "200":
          description: PostgreSQL is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: PostgreSQL is not configured or unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/meta:
    get:
      tags: [Metadata]
      operationId: getMetadata
      summary: Read API metadata
      responses:
        "200":
          description: API identity and environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"
  /api/v1/services:
    get:
      tags: [Services]
      operationId: listServices
      summary: List monitored services
      description: Returns at most 500 service records ordered by name.
      responses:
        "200":
          description: Service inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
        "503":
          description: Database or query dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/incidents:
    get:
      tags: [Incidents]
      operationId: listIncidents
      summary: List incidents
      description: Returns at most 500 incidents ordered by start time, newest first.
      parameters:
        - in: query
          name: status
          required: false
          description: Filter by incident lifecycle status.
          schema:
            type: string
            enum: [open, investigating, monitoring, resolved]
      responses:
        "200":
          description: Incident inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
        "400":
          description: Invalid status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database or query dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok, ready]
    MetadataResponse:
      type: object
      required: [name, version, environment]
      properties:
        name:
          type: string
          const: orbit-api
        version:
          type: string
        environment:
          type: string
    Service:
      type: object
      required: [id, name, description, environment, region, status, source]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        environment:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [operational, degraded, incident, unknown]
        latency_p95_ms:
          type: [number, "null"]
          minimum: 0
        error_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Decimal fraction (0.01 means one percent).
        last_seen_at:
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [demo_seed, live]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Incident:
      type: object
      required: [id, title, description, service_id, service_name, severity, status, started_at, updated_at, source]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        service_id:
          type: string
          format: uuid
        service_name:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, investigating, monitoring, resolved]
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [demo_seed, live]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
