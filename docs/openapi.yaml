            schema:
              $ref: "#/components/schemas/DeploymentAnnotationCreateRequest"
      responses:
        "201":
          description: Deployment annotation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAnnotationResponse"
        "400":
          description: Invalid deployment annotation fields or identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Workspace role cannot create deployment annotations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace or service was not found in the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deployment annotation storage or audit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{workspaceID}/deployments/compare:
