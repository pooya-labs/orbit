            type: string
            format: uuid
      responses:
        "200":
          description: Rolling SLO and error budget calculation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SLOBudgetResponse"
        "404":
          description: Workspace or SLO was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The SLO is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
