name: Verify GitHub Pages publishing source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/verify-pages-source.yml"
      - "docs/deployment/github-pages.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  source:
    name: Verify Pages is configured for GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Read repository Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(jq --raw-output '.build_type // "unknown"' <<< "$response")"
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages build_type: $build_type"

      - name: Require the Actions publishing source
        env:
          BUILD_TYPE: ${{ steps.pages.outputs.build_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_TYPE" != "workflow" ]]; then
            echo "::error title=GitHub Pages uses the wrong source::Current build_type is '$BUILD_TYPE'. Open Settings > Pages > Build and deployment > Source and select GitHub Actions."
            exit 1
          fi
