name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  container-image:
    name: Build and scan the ORBIT API image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the production API image
        run: docker build --pull --file server/Dockerfile --tag orbit-api:ci ./server

      - name: Scan the API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-api:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 10m


      - name: Build the PostgreSQL image with a current Go-built gosu
        run: docker build --pull --file deploy/postgres/Dockerfile --tag orbit-postgres:ci .

      - name: Scan the PostgreSQL image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-postgres:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 10m

      - name: Build the static Go telemetry smoke-test image
        run: docker build --pull --file deploy/observability/telemetry-smoke.Dockerfile --tag orbit-telemetry-smoke:ci .

      - name: Scan the telemetry smoke-test image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-telemetry-smoke:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 10m

      - name: Build the telemetry demo image
        run: docker build --pull --file examples/telemetry-go/Dockerfile --tag orbit-telemetry-demo:ci ./examples/telemetry-go

      - name: Scan the telemetry demo image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-telemetry-demo:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 10m

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate ORBIT API CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-api:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/orbit-api.cdx.json

      - name: Generate PostgreSQL CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-postgres:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/orbit-postgres.cdx.json

      - name: Generate telemetry smoke-runner CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-telemetry-smoke:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/orbit-telemetry-smoke.cdx.json

      - name: Generate telemetry demo CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-telemetry-demo:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/orbit-telemetry-demo.cdx.json

      - name: Upload first-party image SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sboms-first-party-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependencies:
    name: Dependency vulnerability checks
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            server/go.sum
            examples/telemetry-go/go.sum

      - name: Refresh reachable Go dependencies on same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: server
        run: |
          set -euo pipefail
          # Preserve dependency upgrades requested by Dependabot; pin only
          # dependencies with a reviewed security floor or known advisory.
          go get golang.org/x/text@v0.42.0
          go mod tidy
          go get golang.org/x/net@v0.62.0
          go mod download golang.org/x/net@v0.62.0
          go mod tidy
          test "$(go list -m -f '{{.Version}}' golang.org/x/net)" = "v0.62.0"
          go mod verify

      - name: Refresh telemetry demo Go dependencies on same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: examples/telemetry-go
        run: |
          set -euo pipefail
          go get golang.org/x/net@v0.62.0
          go get google.golang.org/grpc@v1.83.2
          go mod tidy
          test "$(go list -m -f '{{.Version}}' golang.org/x/net)" = "v0.62.0"
          test "$(go list -m -f '{{.Version}}' google.golang.org/grpc)" = "v1.83.2"
          go mod verify

      - name: Commit security-fixed Go module metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          module_files=(server/go.mod server/go.sum examples/telemetry-go/go.mod examples/telemetry-go/go.sum)
          if git diff --quiet -- "${module_files[@]}"; then
            echo "Go module metadata is already at security-fixed versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${module_files[@]}"
          git commit -m "fix(deps): patch Go module vulnerabilities"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan reachable Go vulnerabilities
        working-directory: server
        run: govulncheck ./...

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Generate npm lockfile when missing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "npm lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(npm): add deterministic dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Audit npm dependency lockfile
        run: npm audit --audit-level=high

      - name: Review dependency changes in pull requests
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  compose-images:
    name: Scan Compose image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
  # The Keycloak identity provider belongs to the deferred production
  # identity path, not the Pages + Apps Script v1 demo. Its independent scan
  # remains active in security-deferred-identity.yml.
          - name: Redis
            id: redis
            image: redis:7-alpine
          - name: NATS
            id: nats
            image: nats:2-alpine
          - name: Go API build and isolation-test base
            id: go-api-build-base
            image: golang:1.27-alpine
          - name: Telemetry demo Go build base
            id: telemetry-demo-build-base
            image: golang:1.27-alpine
          - name: Telemetry demo runtime base
            id: telemetry-demo-runtime-base
            image: alpine:3.22
    steps:
      - name: Scan ${{ matrix.name }} for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 10m


      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate ${{ matrix.name }} CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/${{ matrix.id }}.cdx.json

      - name: Upload ${{ matrix.name }} SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom/${{ matrix.id }}.cdx.json
          if-no-files-found: error
          retention-days: 30

  prometheus-image:
    name: Build and scan patched Prometheus image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Prometheus v3.16.0 with fixed x/net
        run: docker build --pull --file deploy/observability/prometheus.Dockerfile --tag orbit-prometheus:ci .

      - name: Scan Prometheus for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-prometheus:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 20m

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate Prometheus CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-prometheus:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/orbit-prometheus.cdx.json

      - name: Upload Prometheus SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-prometheus-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom/orbit-prometheus.cdx.json
          if-no-files-found: error
          retention-days: 30

  loki-image:
    name: Build and scan patched Loki image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Loki v3.7.9 with fixed x/net
        run: docker build --pull --file deploy/observability/loki.Dockerfile --tag orbit-loki:ci .

      - name: Scan Loki for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-loki:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 20m

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate Loki CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-loki:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/orbit-loki.cdx.json

      - name: Upload Loki SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-loki-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom/orbit-loki.cdx.json
          if-no-files-found: error
          retention-days: 30

  tempo-image:
    name: Build and scan patched Tempo image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Tempo with patched go-jose
        run: docker build --pull --file deploy/observability/tempo.Dockerfile --tag orbit-tempo:ci .

      - name: Scan Tempo for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-tempo:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 20m

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate Tempo CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-tempo:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/orbit-tempo.cdx.json

      - name: Upload Tempo SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-tempo-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom/orbit-tempo.cdx.json
          if-no-files-found: error
          retention-days: 30

  otel-collector-image:
    name: Build and scan minimal ORBIT Collector image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build minimal ORBIT Collector distribution
        run: docker build --pull --file deploy/observability/collector.Dockerfile --tag orbit-otel-collector:ci .

      - name: Scan ORBIT Collector for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-otel-collector:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 20m

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate ORBIT Collector CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-otel-collector:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/orbit-otel-collector.cdx.json

      - name: Upload ORBIT Collector SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-otel-collector-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom/orbit-otel-collector.cdx.json
          if-no-files-found: error
          retention-days: 30

  caddy-image:
    name: Build and scan patched Caddy ingress image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Caddy with patched dependencies
        run: docker build --pull --file deploy/production/caddy.Dockerfile --tag orbit-caddy:ci .

      - name: Scan Caddy ingress for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-caddy:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 15m

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate Caddy CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-caddy:ci
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/orbit-caddy.cdx.json

      - name: Upload Caddy SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-caddy-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom/orbit-caddy.cdx.json
          if-no-files-found: error
          retention-days: 30
