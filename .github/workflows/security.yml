name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  container-image:
    name: Build and scan the ORBIT API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the production API image
        run: docker build --pull --file server/Dockerfile --tag orbit-api:ci ./server

      - name: Scan the API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-api:ci
          version: v0.76.1
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 10m

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependencies:
    name: Dependency vulnerability checks
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: server/go.sum

      - name: Refresh reachable Go dependencies on same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: server
        run: |
          set -euo pipefail
          go get github.com/jackc/pgx/v5@v5.9.2
          go get google.golang.org/grpc@v1.83.2
          go get golang.org/x/text@v0.42.0
          go mod tidy
          go get golang.org/x/net@v0.60.0
          go mod download golang.org/x/net@v0.60.0
          test "$(go list -m -f '{{.Version}}' golang.org/x/net)" = "v0.60.0"
          go mod verify

      - name: Commit security-fixed Go module metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- server/go.mod server/go.sum; then
            echo "Go module metadata is already at security-fixed versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/go.mod server/go.sum
          git commit -m "fix(deps): patch reachable Go vulnerabilities"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan reachable Go vulnerabilities
        working-directory: server
        run: govulncheck ./...

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Generate npm lockfile when missing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "npm lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(npm): add deterministic dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Audit npm dependency lockfile
        run: npm audit --audit-level=high

      - name: Review dependency changes in pull requests
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  compose-images:
    name: Scan Compose image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL
            image: postgres:17-alpine
          - name: Redis
            image: redis:7-alpine
          - name: NATS
            image: nats:2-alpine
          - name: OpenTelemetry Collector
            image: otel/opentelemetry-collector-contrib:0.164.0
          - name: Prometheus
            image: prom/prometheus:v3.14.0
          - name: Loki
            image: grafana/loki:3.7.9
          - name: Tempo
            image: grafana/tempo:3.1.1
          - name: Caddy production ingress
            image: caddy:2.10.2-alpine
          - name: Go API build and isolation-test base
            image: golang:1.27-alpine
          - name: Telemetry demo Go build base
            image: golang:1.25-alpine
          - name: Telemetry demo runtime base
            image: alpine:3.22
          - name: Telemetry smoke test base
            image: python:3.13-alpine
    steps:
      - name: Scan ${{ matrix.name }} for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          version: v0.76.1
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 10m
