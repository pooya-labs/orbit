name: Publish patched Keycloak 26.8.2 multi-architecture image

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Build, publish, and scan the patched image in GHCR. No production deployment is performed."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: keycloak-image-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pooya-labs/orbit-keycloak
  KEYCLOAK_BASE_IMAGE: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
  KEYCLOAK_SOURCE_SHA_PART_1: e514445f9d
  KEYCLOAK_SOURCE_SHA_PART_2: cdabc5bdcf
  KEYCLOAK_SOURCE_SHA_PART_3: 67cab56c1e
  KEYCLOAK_SOURCE_SHA_PART_4: 49655de067

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish == true
    name: Build, verify and publish Keycloak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      MAVEN_OPTS: -Xms512m -Xmx4g -XX:+ExitOnOutOfMemoryError
    steps:
      - name: Checkout ORBIT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify pinned Keycloak base manifest supports both architectures
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$KEYCLOAK_BASE_IMAGE" | tee /tmp/keycloak-base-manifest.txt
          grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' /tmp/keycloak-base-manifest.txt
          grep -Eq 'Platform:[[:space:]]+linux/arm64([[:space:]]|$)' /tmp/keycloak-base-manifest.txt

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch the immutable Keycloak source commit
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${KEYCLOAK_SOURCE_SHA_PART_1}${KEYCLOAK_SOURCE_SHA_PART_2}${KEYCLOAK_SOURCE_SHA_PART_3}${KEYCLOAK_SOURCE_SHA_PART_4}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          git init /tmp/keycloak
          git -C /tmp/keycloak remote add origin https://github.com/keycloak/keycloak.git
          git -C /tmp/keycloak fetch --depth 1 origin "$source_sha"
          git -C /tmp/keycloak checkout --detach FETCH_HEAD
          test "$(git -C /tmp/keycloak rev-parse HEAD)" = "$source_sha"

      - name: Apply the narrowly scoped Guava BOM override
        shell: bash
        run: |
          set -euo pipefail
          git -C /tmp/keycloak apply --check "$GITHUB_WORKSPACE/deploy/production/keycloak/keycloak-26.8.2-guava-33.7.2.patch"
          git -C /tmp/keycloak apply "$GITHUB_WORKSPACE/deploy/production/keycloak/keycloak-26.8.2-guava-33.7.2.patch"

      - name: Verify Maven resolves patched Guava before building
        working-directory: /tmp/keycloak
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f quarkus/runtime/pom.xml help:effective-pom -Doutput=/tmp/keycloak-effective-pom.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/keycloak-effective-pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          matches = []
          for dep in root.findall('.//m:dependencyManagement/m:dependencies/m:dependency', ns):
              group = dep.findtext('m:groupId', default='', namespaces=ns)
              artifact = dep.findtext('m:artifactId', default='', namespaces=ns)
              version = dep.findtext('m:version', default='', namespaces=ns)
              if group == 'com.google.guava' and artifact == 'guava':
                  matches.append(version)
          if not matches or any(v != '33.7.2-jre' for v in matches):
              raise SystemExit(f'Expected only Guava 33.7.2-jre in effective dependency management; got {matches}')
          print('Effective Guava version:', matches)
          PY

      - name: Build Keycloak core and Quarkus distribution
        working-directory: /tmp/keycloak/quarkus
        shell: bash
        run: |
          set -euo pipefail
          ../mvnw -B -ntp -f ../pom.xml clean install -DskipTestsuite -DskipExamples -DskipTests
          ../mvnw -B -ntp clean install -DskipTests

      - name: Verify the generated distribution contains only patched Guava
        working-directory: /tmp/keycloak/quarkus
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist/target -maxdepth 1 -type f -name 'keycloak-26.8.2.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p /tmp/keycloak-dist
          tar -xzf "$archive" -C /tmp/keycloak-dist
          mapfile -t jars < <(find /tmp/keycloak-dist/keycloak-26.8.2/lib/lib/main -maxdepth 1 -type f -name 'com.google.guava.guava-*.jar' -print)
          test "${#jars[@]}" -eq 1
          test "$(basename "${jars[0]}")" = "com.google.guava.guava-33.7.2-jre.jar"
          if find /tmp/keycloak-dist/keycloak-26.8.2 -type f -name '*guava-33.6.0*' | grep -q .; then
            echo "Vulnerable Guava 33.6.0 remains in the distribution" >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.keycloak-patched-context"
          cp -a /tmp/keycloak-dist/keycloak-26.8.2 "$GITHUB_WORKSPACE/.keycloak-patched-context/"

      - name: Build the candidate from the pinned multi-architecture base image
        shell: bash
        run: |
          set -euo pipefail
          cat > .keycloak-patched-context/Dockerfile <<'DOCKERFILE'
          FROM ${{ env.KEYCLOAK_BASE_IMAGE }}
          USER 0
          RUN rm -rf /opt/keycloak && mkdir -p /opt/keycloak && chown 1000:0 /opt/keycloak
          COPY --chown=1000:0 keycloak-26.8.2/ /opt/keycloak/
          ARG BUILD_REVISION
          LABEL org.opencontainers.image.source="https://github.com/pooya-labs/orbit" \
                org.opencontainers.image.revision="${BUILD_REVISION}" \
                org.opencontainers.image.version="26.8.2-guava-33.7.2"
          USER 1000
          DOCKERFILE
          image="orbit-keycloak:26.8.2-guava-33.7.2-${{ matrix.arch }}"
          docker build --pull --platform "${{ matrix.platform }}" --build-arg BUILD_REVISION="$GITHUB_SHA" -t "$image" .keycloak-patched-context
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint /opt/keycloak/bin/kc.sh "$image" --version

      - name: Start candidate and verify readiness, OIDC discovery and runtime mappings
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker logs keycloak-patched 2>/dev/null || true; docker rm -f keycloak-patched >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          image="orbit-keycloak:26.8.2-guava-33.7.2-${{ matrix.arch }}"
          docker run -d --name keycloak-patched -p 8080:8080 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-placeholder-password \
            -e KC_HEALTH_ENABLED=true -e KC_METRICS_ENABLED=true \
            -e KC_HTTP_ENABLED=true -e KC_HOSTNAME_STRICT=false \
            "$image" start-dev --http-port=8080
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:9000/health/ready >/tmp/keycloak-ready.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          curl --fail --silent http://127.0.0.1:8080/realms/master/.well-known/openid-configuration > /tmp/keycloak-oidc.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/keycloak-oidc.json'))
          assert d.get('issuer', '').endswith('/realms/master'), d.get('issuer')
          print('OIDC discovery issuer:', d['issuer'])
          PY
          docker exec -u 0 keycloak-patched sh -ec '
            found=0
            for maps in /proc/[0-9]*/maps; do
              [ -r "$maps" ] || continue
              if grep -E "/libsqlite3[.]so|/libsoftokn3[.]so" "$maps"; then
                echo "Keycloak runtime mapped a SQLite/NSS softoken library: $maps" >&2
                found=1
              fi
            done
            if [ "$found" -ne 0 ]; then exit 1; fi
            echo "KEYCLOAK_SQLITE_RUNTIME_MAP=none"
          '

      - name: Verify FTS5 compile option in this architecture's SQLite library
        shell: bash
        run: |
          set -euo pipefail
          image="orbit-keycloak:26.8.2-guava-33.7.2-${{ matrix.arch }}"
          container="$(docker create --platform "${{ matrix.platform }}" "$image")"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker cp "$container:/usr/lib64/libsqlite3.so.0.8.6" /tmp/keycloak-libsqlite3.so
          python3 - <<'PY'
          import ctypes
          lib = ctypes.CDLL("/tmp/keycloak-libsqlite3.so")
          lib.sqlite3_compileoption_used.argtypes = [ctypes.c_char_p]
          lib.sqlite3_compileoption_used.restype = ctypes.c_int
          enabled = lib.sqlite3_compileoption_used(b"ENABLE_FTS5")
          session = lib.sqlite3_compileoption_used(b"ENABLE_SESSION")
          print("SQLITE_ENABLE_FTS5=" + str(enabled))
          print("SQLITE_ENABLE_SESSION=" + str(session))
          if not enabled:
              raise SystemExit("Expected FTS5 compile option in this platform SQLite library.")
          PY

      - name: Scan candidate without VEX to preserve raw findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-keycloak:26.8.2-guava-33.7.2-${{ matrix.arch }}
          trivy-config: trivy-keycloak-raw.yaml
          version: v0.76.1
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: json
          output: /tmp/keycloak-raw.json
          cache: false
          timeout: 10m

      - name: Scan candidate with exact-package VEX and strict gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orbit-keycloak:26.8.2-guava-33.7.2-${{ matrix.arch }}
          trivy-config: trivy-keycloak.yaml
          version: v0.76.1
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: json
          output: /tmp/keycloak-filtered.json
          cache: false
          timeout: 10m

      - name: Assert raw FTS5 detection, scoped VEX and patched Guava
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          def findings(path):
              report = json.load(open(path))
              return [v for result in report.get('Results') or [] for v in result.get('Vulnerabilities') or []]

          raw = findings('/tmp/keycloak-raw.json')
          filtered = findings('/tmp/keycloak-filtered.json')
          raw_fts5 = [v for v in raw if v.get('VulnerabilityID') == 'CVE-2026-119373']
          filtered_fts5 = [v for v in filtered if v.get('VulnerabilityID') == 'CVE-2026-119373']
          raw_fts5_secure = [v for v in raw if v.get('VulnerabilityID') == 'CVE-2026-119374']
          filtered_fts5_secure = [v for v in filtered if v.get('VulnerabilityID') == 'CVE-2026-119374']
          raw_session = [v for v in raw if v.get('VulnerabilityID') == 'CVE-2026-119379']
          filtered_session = [v for v in filtered if v.get('VulnerabilityID') == 'CVE-2026-119379']
          raw_guava = [v for v in raw if v.get('VulnerabilityID') == 'CVE-2026-102554']
          filtered_guava = [v for v in filtered if v.get('VulnerabilityID') == 'CVE-2026-102554']

          if not raw_fts5:
              raise SystemExit('Raw Trivy scan did not report the expected FTS5 finding; inspect image and scan database.')
          if not raw_fts5_secure:
              raise SystemExit('Raw Trivy scan did not report CVE-2026-119374; inspect fresh database and exact package inventory.')
          if not raw_session:
              raise SystemExit('Raw Trivy scan did not report CVE-2026-119379; inspect fresh database and exact package inventory.')
          if filtered_fts5:
              raise SystemExit('The exact-package NSS-path VEX did not filter CVE-2026-119373: ' + repr(filtered_fts5))
          if filtered_fts5_secure:
              raise SystemExit('The exact-package FTS5 secure-delete VEX did not filter CVE-2026-119374: ' + repr(filtered_fts5_secure))
          if filtered_session:
              raise SystemExit('The exact-package SQLite Session VEX did not filter CVE-2026-119379: ' + repr(filtered_session))
          if raw_guava or filtered_guava:
              raise SystemExit('Patched candidate still contains Guava CVE-2026-102554: ' + repr(raw_guava or filtered_guava))
          print('PASS: raw Trivy detects FTS5, FTS5 secure-delete, and SQLite Session findings; exact package/path VEX statements filter only those findings; patched Guava is absent.')
          PY

      - name: Push the validated architecture image to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="orbit-keycloak:26.8.2-guava-33.7.2-${{ matrix.arch }}"
          tag="sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker tag "$image" "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          echo "Pushed $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"

  publish-manifest:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish == true
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      image_tag: ${{ steps.manifest.outputs.image_tag }}
    steps:
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Create and inspect the immutable multi-architecture manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          version_tag="26.8.2-guava-33.7.2-${GITHUB_SHA}"
          docker buildx imagetools create \
            --tag "$IMAGE:$version_tag" \
            "$IMAGE:sha-${GITHUB_SHA}-amd64" \
            "$IMAGE:sha-${GITHUB_SHA}-arm64"
          manifest="$(docker buildx imagetools inspect "$IMAGE:$version_tag")"
          printf '%s\n' "$manifest"
          grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' <<< "$manifest"
          grep -Eq 'Platform:[[:space:]]+linux/arm64([[:space:]]|$)' <<< "$manifest"
          digest="$(awk '$1 == "Digest:" {print $2; exit}' <<< "$manifest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_tag=$version_tag" >> "$GITHUB_OUTPUT"
          {
            echo "### GHCR candidate published"
            echo
            echo "- Image: \`$IMAGE@$digest\`"
            echo "- Tag: \`$IMAGE:$version_tag\`"
            echo "- Architectures: linux/amd64, linux/arm64"
            echo "- This workflow does not deploy or modify production Compose."
          } >> "$GITHUB_STEP_SUMMARY"

  scan-published-digest:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish == true
    needs: publish-manifest
    name: Strict scan of published digest (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout VEX and Trivy configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR and pull the exact manifest digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image_ref="$IMAGE@${{ needs.publish-manifest.outputs.digest }}"
          docker pull --platform "${{ matrix.platform }}" "$image_ref"
          actual="$(docker image inspect "$image_ref" --format '{{.Os}}/{{.Architecture}}')"
          test "$actual" = "${{ matrix.platform }}"
          echo "Verified $actual for $image_ref"

      - name: Scan exact digest without VEX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.publish-manifest.outputs.digest }}
          trivy-config: trivy-keycloak-raw.yaml
          version: v0.76.1
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: json
          output: /tmp/published-keycloak-raw.json
          cache: false
          timeout: 10m

      - name: Scan exact digest with scoped VEX and strict HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.publish-manifest.outputs.digest }}
          trivy-config: trivy-keycloak.yaml
          version: v0.76.1
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: json
          output: /tmp/published-keycloak-filtered.json
          cache: false
          timeout: 10m

      - name: Assert published digest is clean within the exact VEX scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          def findings(path):
              report = json.load(open(path))
              return [v for result in report.get('Results') or [] for v in result.get('Vulnerabilities') or []]

          raw = findings('/tmp/published-keycloak-raw.json')
          filtered = findings('/tmp/published-keycloak-filtered.json')
          raw_fts5 = [v for v in raw if v.get('VulnerabilityID') == 'CVE-2026-119373']
          filtered_fts5 = [v for v in filtered if v.get('VulnerabilityID') == 'CVE-2026-119373']
          raw_fts5_secure = [v for v in raw if v.get('VulnerabilityID') == 'CVE-2026-119374']
          filtered_fts5_secure = [v for v in filtered if v.get('VulnerabilityID') == 'CVE-2026-119374']
          raw_session = [v for v in raw if v.get('VulnerabilityID') == 'CVE-2026-119379']
          filtered_session = [v for v in filtered if v.get('VulnerabilityID') == 'CVE-2026-119379']
          raw_guava = [v for v in raw if v.get('VulnerabilityID') == 'CVE-2026-102554']
          filtered_guava = [v for v in filtered if v.get('VulnerabilityID') == 'CVE-2026-102554']

          if not raw_fts5 or not raw_fts5_secure or not raw_session:
              raise SystemExit('Raw Trivy scan must retain all expected FTS5/Session findings: ' + repr((raw_fts5, raw_fts5_secure, raw_session)))
          if filtered_fts5 or filtered_fts5_secure or filtered_session:
              raise SystemExit('The exact-package NSS consumer-path VEX did not filter only the scoped SQLite findings: ' + repr((filtered_fts5, filtered_fts5_secure, filtered_session)))
          if raw_guava or filtered_guava:
              raise SystemExit('Published image still contains the patched Guava CVE: ' + repr(raw_guava or filtered_guava))
          print('PASS: published digest retains raw FTS5/Session visibility, applies only the scoped package/path VEX, and contains no Guava CVE.')
          PY
          echo "Strict published-digest scan passed on ${{ matrix.platform }}: $IMAGE@${{ needs.publish-manifest.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
