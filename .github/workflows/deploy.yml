name: Deploy ORBIT to GitHub Pages

on:
  push:
    branches:
      - main
      # Temporary live preview: this branch publishes over the single Pages site.
      - feat/m01-accessibility-review
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Never cancel a deployment after it has been accepted by GitHub Pages.
  # New pushes wait behind the active publish instead of orphaning its status.
  cancel-in-progress: false

jobs:
  build:
    name: Build static web workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      # Branch publishing can start a second Jekyll deployment from README.md
      # and overwrite the Next.js static export. Fail closed unless Actions owns
      # the repository's Pages publishing source.
      - name: Verify GitHub Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(jq --raw-output '.build_type // "unknown"' <<< "$response")"
          echo "GitHub Pages build_type: ${build_type}"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error title=GitHub Pages source mismatch::Set Settings > Pages > Build and deployment > Source to GitHub Actions, then rerun this workflow. Current build_type: ${build_type}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    name: Publish website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
