name: NVDA Windows screen-reader smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nvda-screen-reader-smoke.yml"
      - "scripts/nvda-screen-reader-smoke.ps1"
      - "app/**"
      - "lib/**"
      - "next.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-nvda-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Reuse the latest passing screen-reader check when UI code is unchanged
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Checkout full history for successful-run comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check whether UI files changed since the last passing run
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          run_tests=true

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="$HEAD_REF" -f event=pull_request -F per_page=100)"
            previous_success="$(jq -r --arg pr "$PR_NUMBER" --arg head "$PR_HEAD" '
              [.workflow_runs[]
                | select(.event == "pull_request" and .conclusion == "success" and .head_sha != $head)
                | select(any(.pull_requests[]?; (.number | tostring) == $pr))]
              | sort_by(.run_started_at // .created_at // "")
              | last
              | .head_sha // ""
            ' <<< "$runs")"

            comparison_base="$previous_success"
            if [[ -z "$comparison_base" ]]; then
              comparison_base="$PR_BASE"
            fi

            if [[ -n "$comparison_base" ]] && git cat-file -e "$comparison_base^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$comparison_base" "$PR_HEAD")"
            else
              changed="$(git ls-files)"
            fi

            run_tests=false
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                app/*|lib/*|next.config.ts|scripts/nvda-screen-reader-smoke.ps1)
                  run_tests=true
                  break
                  ;;
              esac
            done <<< "$changed"

            echo "NVDA UI-relevant changes since last passing run:"
            printf '%s\n' "$changed"
          fi

          echo "Run real NVDA test: $run_tests"
          echo "run=$run_tests" >> "$GITHUB_OUTPUT"

  nvda-screen-reader:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: Real NVDA Browse Mode heading navigation
    runs-on: windows-latest
    timeout-minutes: 20
    # The hosted Windows smoke test now exercises real NVDA speech and H-key
    # navigation; failures are required PR checks rather than advisory results.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the exact PR version of the static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install NVDA and Microsoft WinApp CLI
        shell: pwsh
        run: |
          winget install --id NVAccess.NVDA --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "NVDA installation failed with exit code $LASTEXITCODE" }
          winget install --id Microsoft.WinAppCli --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "WinApp CLI installation failed with exit code $LASTEXITCODE" }

      - name: Run NVDA Speech Viewer and real H-key smoke test
        shell: pwsh
        run: ./scripts/nvda-screen-reader-smoke.ps1
