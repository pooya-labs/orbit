name: Create ORBIT GitHub Release

on:
  workflow_run:
    workflows: ["Deploy ORBIT to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Publish versioned ORBIT preview release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read application version
        id: version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update matching preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ORBIT v${{ steps.version.outputs.version }} — Public Preview
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            ## ORBIT — Distributed Systems Intelligence & Observability

            **Public preview:** https://pooya16pg-spec.github.io/orbit/

            ### Included
            - Responsive Next.js observability dashboard with Overview, Metrics, Logs, and Traces views.
            - Explicit Demo / API source switch for service and incident inventory.
            - Live telemetry views that query the ORBIT API, with 15m / 1h / 6h / 24h windows, query timestamps, refresh, and loading / empty / error states.
            - Cross-backend service discovery across Prometheus, Loki, and Tempo, with merged names, source provenance, and a shared service selector.
            - Cross-backend service discovery across Prometheus, Loki, and Tempo, with merged names, source provenance, and a shared service selector.
            - Go API with health, metadata, PostgreSQL-backed service and incident endpoints, plus bounded Prometheus, Loki, and Tempo query endpoints.
            - Optional local Docker Compose observability profile with OpenTelemetry Collector, Prometheus, Loki, Tempo, and an instrumented Go demo workload.
            - OpenAPI 3.1 contract, typed TypeScript API client, and GitHub Actions checks that verify metrics, logs, and traces through both their backends and the ORBIT API.

            ### Important limitations
            - The public GitHub Pages site hosts the frontend only; it does not host the Go API or telemetry backends.
            - Live telemetry on the hosted site requires a separately hosted HTTPS ORBIT API and telemetry stack, with the Pages origin added to ORBIT_ALLOWED_ORIGINS.
            - The current request-rate metric is the instrumented orbit-telemetry-demo counter. Other discovered services appear in the shared selector, but may not expose that demo-specific metric.
            - The production ORBIT API is not yet self-instrumented, and discovered service names are not yet persisted as normalized PostgreSQL service records.
            - Redis and NATS are provisioned for local development but are not yet wired into application behavior.
            - Production authentication, high availability, and hardened operational policies remain future work.

            This is an early public preview, not a production monitoring service.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
