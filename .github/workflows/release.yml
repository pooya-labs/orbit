name: Publish ORBIT v1.0.0 Stable Release

on:
  workflow_run:
    workflows: ["Deploy ORBIT to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  release:
    name: Publish stable v1.0.0 after exact-head gates
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify application version is exactly 1.0.0
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$VERSION" != "1.0.0" ]]; then
            echo "::error title=Unexpected release version::Expected 1.0.0, found $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-commit CI and Security workflows
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=("CI" "Security")
          all_green=false
          for attempt in $(seq 1 90); do
            runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="$DEPLOYED_SHA" -f branch=main -F per_page=100)"
            waiting=false
            for workflow in "${workflows[@]}"; do
              state="$(jq -r --arg name "$workflow" --arg sha "$DEPLOYED_SHA" '
                [.workflow_runs[]
                  | select(.name == $name and .head_sha == $sha and .event == "push" and .head_branch == "main")]
                | sort_by(.run_started_at // "")
                | last
                | if . == null then "missing"
                  else "(.status):(.conclusion // "pending")"
                  end
              ' <<< "$runs")"
              echo "$workflow on $DEPLOYED_SHA: $state"
              case "$state" in
                completed:success) ;;
                completed:failure|completed:cancelled|completed:timed_out|completed:action_required)
                  echo "::error title=Release gate failed::$workflow did not pass on the deployed commit."
                  exit 1
                  ;;
                *)
                  waiting=true
                  ;;
              esac
            done
            if [[ "$waiting" == "false" ]]; then
              all_green=true
              break
            fi
            sleep 20
          done
          if [[ "$all_green" != "true" ]]; then
            echo "::error title=Release gates not completed::CI and Security did not both complete successfully on the exact deployed commit."
            exit 1
          fi

      - name: Create immutable v1.0.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          REF="tags/v1.0.0"
          if EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${REF}" 2>/dev/null)"; then
            EXISTING_SHA="$(jq -r '.object.sha' <<< "$EXISTING")"
            if [[ "$EXISTING_SHA" != "$DEPLOYED_SHA" ]]; then
              echo "::error title=Stable tag already exists::v1.0.0 points to $EXISTING_SHA; refusing to move a published stable tag."
              exit 1
            fi
            echo "The immutable v1.0.0 tag already points to the deployed commit."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/$REF" -f sha="$DEPLOYED_SHA"
          fi

      - name: Create or update the stable GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ORBIT v1.0.0 — Stable Portfolio Demo
          body_path: docs/releases/v1.0.0.md
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
