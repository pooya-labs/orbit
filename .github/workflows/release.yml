name: Create ORBIT GitHub Release

on:
  workflow_run:
    workflows: ["Deploy ORBIT to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Publish v0.1.0 preview release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or update preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ORBIT v0.1.0 — Public Preview
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            ## ORBIT — Distributed Systems Intelligence & Observability

            **Public preview:** https://pooya16pg-spec.github.io/orbit/

            ### Included
            - Responsive Next.js observability workspace for desktop and mobile.
            - Go API with health, metadata, service inventory, and incident endpoints.
            - PostgreSQL schema, versioned migration, and clearly labelled demo seed rows.
            - Docker Compose for PostgreSQL, Redis, NATS JetStream, and the Go API.
            - GitHub Actions CI and GitHub Pages deployment.

            ### Important limitations
            - Dashboard metrics and incidents are illustrative demo data.
            - The public Pages site is frontend-only; the Go API is not hosted publicly.
            - Redis and NATS are provisioned locally but are not yet wired into API behavior.
            - OpenTelemetry ingestion, authentication, and production operations workflows are still planned.

            This is an early public preview, not a production monitoring service.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
