name: Create ORBIT GitHub Release

on:
  workflow_run:
    workflows: ["Deploy ORBIT to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Publish versioned ORBIT preview release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read application version
        id: version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update matching preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ORBIT v${{ steps.version.outputs.version }} — Public Preview
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            ## ORBIT — Distributed Systems Intelligence & Observability

            **Public preview:** https://pooya16pg-spec.github.io/orbit/

            ### Included
            - Responsive Next.js observability dashboard with Overview, Metrics, Logs, and Traces views.
            - Explicit Demo / API source switch for service and incident inventory.
            - Live telemetry views that query the ORBIT API, with 15m / 1h / 6h / 24h windows, query timestamps, refresh, and loading / empty / error states.
            - Cross-backend service discovery across Prometheus, Loki, and Tempo, with merged names, source provenance, and a shared service selector.
            - Persisted PostgreSQL telemetry service catalog with normalized service identities, source relationships, first-seen / last-seen / last-discovered timestamps, bounded JSONB resource attributes, and per-attribute backend provenance.
            - Cursor-based service-catalog pagination, with a dashboard control to load additional pages.
            - Allow-listed Prometheus grouping for the demo request-rate metric, independent chart lines per series, and per-series stale-sample / telemetry-gap warnings.
            - English and Persian dashboard localization, persistent language selection, locale-aware formatting, and responsive right-to-left layout.
            - Public creator / project-owner attribution linked to the GitHub profile and source repository.
            - Go API with health, metadata, PostgreSQL-backed service and incident endpoints, plus bounded Prometheus, Loki, and Tempo query endpoints.
            - Optional local Docker Compose observability profile with OpenTelemetry Collector, Prometheus, Loki, Tempo, and an instrumented Go demo workload.
            - OpenAPI 3.1 contract, typed TypeScript API client, and GitHub Actions checks that verify metrics, logs, and traces through both their backends and the ORBIT API.

            ### Important limitations
            - The public GitHub Pages site hosts the frontend only; it does not host the Go API or telemetry backends.
            - Live telemetry on the hosted site requires a separately hosted HTTPS ORBIT API and telemetry stack, with the Pages origin added to ORBIT_ALLOWED_ORIGINS.
            - The current request-rate metric is the instrumented orbit-telemetry-demo counter. Other discovered services appear in the shared selector, but may not expose that demo-specific metric.
            - Resource-attribute discovery currently uses a bounded allowlist of Prometheus labels, Loki labels, and Tempo resource tags. Full semantic-convention resource ingestion directly from workload instrumentation remains future work.
            - Metric grouping is available only for the instrumented demo request-rate counter; arbitrary metric-name discovery and selection are not implemented.
            - The production ORBIT API is not yet self-instrumented.
            - Redis and NATS are provisioned for local development but are not yet wired into application behavior.
            - The Go API implements server-side OIDC role enforcement, workspace membership/scoped reads, transactional M05 operator workflows, and authenticated workload-aware OTLP ingestion. The public GitHub Pages site remains static and is not connected to a hosted production API; real-provider login, production TLS/network controls, and target-environment deployment gates remain open.
            - M05 incident/alert/SLO workflows and M06 production hardening remain future milestones. Redis and NATS are provisioned locally but are not yet integrated.

            This is an early public preview, not a production monitoring service.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
