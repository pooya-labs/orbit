name: Create ORBIT GitHub Release

on:
  workflow_run:
    workflows: ["Deploy ORBIT to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Publish versioned ORBIT preview release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read application version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update matching preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ORBIT v${{ steps.version.outputs.version }} — Public Preview
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            ## ORBIT — Distributed Systems Intelligence & Observability

            **Public preview:** https://pooya16pg-spec.github.io/orbit/

            ### Included
            - Responsive Next.js observability workspace.
            - Explicit Demo / API source switch for service and incident inventories.
            - Go API with health, metadata, PostgreSQL-backed service and incident endpoints.
            - Docker Compose for PostgreSQL, Redis, NATS JetStream, and the Go API.
            - OpenAPI 3.1 contract, typed TypeScript API client, and CI / Pages deployment.

            ### Important limitations
            - The default public dashboard uses clearly labelled demo fixtures.
            - API mode reads services and incidents only; aggregate time-series metrics are not implemented yet.
            - The public Pages site is frontend-only; the Go API is not hosted publicly.
            - Redis and NATS are provisioned but are not yet wired into API behavior.
            - OpenTelemetry ingestion, authentication, and production operations workflows remain planned.

            This is an early public preview, not a production monitoring service.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
