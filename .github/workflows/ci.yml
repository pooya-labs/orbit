name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: Go API tests and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orbit_test
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ORBIT_TEST_DATABASE_URL: postgres://orbit:orbit_test_only@localhost:5432/orbit_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Verify committed Go module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o /tmp/orbit-api ./cmd/orbit-api

  observability:
    name: Local telemetry pipeline end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --profile observability config --quiet

      - name: Assert raw OTLP receivers are private-network-only
        run: python3 scripts/check_collector_network.py

      - name: Start telemetry stack and instrumented demo
        run: docker compose --profile observability up -d prometheus loki tempo otel-collector telemetry-demo api

      - name: Wait for telemetry services
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9090/-/ready >/dev/null \
              && curl -fsS http://127.0.0.1:3100/ready >/dev/null \
              && curl -fsS http://127.0.0.1:3200/ready >/dev/null \
              && curl -fsS http://127.0.0.1:13133/ >/dev/null \
              && curl -fsS http://127.0.0.1:8081/healthz >/dev/null  \
              && curl -fsS http://127.0.0.1:8080/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --profile observability logs --no-color
            exit 1
          fi

      - name: Verify OTLP signals and ORBIT API query endpoints end to end
        run: python3 scripts/observability_smoke.py

      - name: Verify Prometheus scrapes the ORBIT Collector
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            target_up="$(curl -fsS --get \
              --data-urlencode 'query=up{job="orbit-otel-collector"}' \
              http://127.0.0.1:9090/api/v1/query \
              | python3 -c 'import json,sys; rows=json.load(sys.stdin)["data"]["result"]; print(rows[0]["value"][1] if rows else "")')"
            if [ "$target_up" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile observability logs --no-color
          exit 1

      - name: Stop telemetry stack and demo
        if: always()
        run: docker compose --profile observability down -v --remove-orphans

  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
