name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: Go API tests and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orbit_test
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ORBIT_TEST_DATABASE_URL: postgres://orbit:orbit_test_only@localhost:5432/orbit_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Verify committed Go module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o /tmp/orbit-api ./cmd/orbit-api

  observability:
    name: Local telemetry pipeline end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --profile observability config --quiet

      - name: Validate production ingress overlay and network isolation
        env:
          ORBIT_DATABASE_URL: postgres://orbit:ci-placeholder@postgres:5432/orbit?sslmode=disable
          POSTGRES_PASSWORD: ci-placeholder
          ORBIT_OIDC_ISSUER: https://identity.example.test
          ORBIT_OIDC_AUDIENCE: orbit-api
          ORBIT_WORKLOAD_OIDC_ISSUER: https://identity.example.test
          ORBIT_WORKLOAD_OIDC_AUDIENCE: orbit-otlp
          ORBIT_OTLP_HTTP_DOMAIN: otlp-http.example.test
          ORBIT_OTLP_GRPC_DOMAIN: otlp-grpc.example.test
        run: |
          docker run --rm \
            -e ORBIT_OTLP_HTTP_DOMAIN -e ORBIT_OTLP_GRPC_DOMAIN \
            -v "$PWD/deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose -f docker-compose.yml -f deploy/production/compose.ingress.yaml --profile production-ingress config --format json > /tmp/orbit-compose.json
          python3 - <<'PY'
          import json
          with open("/tmp/orbit-compose.json", encoding="utf-8") as handle:
              config = json.load(handle)
          services = config["services"]
          def published(service):
              return {int(port["target"]) for port in services[service].get("ports", [])}
          assert published("caddy") == {80, 443}, published("caddy")
          assert not ({4319, 4320} & published("api")), published("api")
          assert not published("otel-collector"), published("otel-collector")
          assert "ingress" in services["api"]["networks"]
          assert "ingress" in services["caddy"]["networks"]
          assert "default" not in services["caddy"]["networks"]
          assert "telemetry-internal" not in services["caddy"]["networks"]
          assert "ingress" not in services["postgres"]["networks"]
          assert "telemetry-internal" not in services["caddy"]["networks"]
          PY

      - name: Assert raw OTLP receivers are private-network-only
        run: python3 scripts/check_collector_network.py

      - name: Start telemetry stack and instrumented demo
        run: docker compose --profile observability up -d prometheus loki tempo otel-collector telemetry-demo api

      - name: Wait for telemetry services on the private network
        run: docker compose --profile observability run --rm telemetry-smoke scripts/wait_for_telemetry.py

      - name: Verify OTLP signals and ORBIT API query endpoints end to end
        run: docker compose --profile observability run --rm telemetry-smoke scripts/observability_smoke.py

      - name: Verify Prometheus scrapes the ORBIT Collector
        run: docker compose --profile observability run --rm telemetry-smoke scripts/check_prometheus_scrape.py

      - name: Stop telemetry stack and demo
        if: always()
        run: docker compose --profile observability down -v --remove-orphans

  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
