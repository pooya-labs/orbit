name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-hygiene:
    name: Workflow action pin policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify immutable third-party action pins
        run: python3 scripts/check_workflow_action_pins.py

  api:
    name: Go API tests and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orbit_test
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ORBIT_TEST_DATABASE_URL: postgres://orbit:orbit_test_only@localhost:5432/orbit_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"

      - name: Verify committed Go module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o /tmp/orbit-api ./cmd/orbit-api

      - name: Verify PostgreSQL backup and restore round-trip
        working-directory: .
        run: |
          docker run --rm --network host \
            -e ORBIT_TEST_DATABASE_URL \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=orbit \
            -e PGPASSWORD=orbit_test_only \
            -e PGSSLMODE=disable \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            postgres:17-alpine sh /workspace/scripts/postgres_backup_restore_smoke.sh

  observability:
    name: Local telemetry pipeline end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        run: docker compose --profile observability config --quiet

      - name: Validate production ingress overlay and network isolation
        env:
          ORBIT_DATABASE_URL: postgres://orbit:ci-placeholder@postgres:5432/orbit?sslmode=disable
          POSTGRES_PASSWORD: ci-placeholder
          ORBIT_OIDC_ISSUER: https://identity.example.test
          ORBIT_OIDC_AUDIENCE: orbit-api
          ORBIT_WORKLOAD_OIDC_ISSUER: https://identity.example.test
          ORBIT_WORKLOAD_OIDC_AUDIENCE: orbit-otlp
          ORBIT_OTLP_HTTP_DOMAIN: otlp-http.example.test
          ORBIT_OTLP_GRPC_DOMAIN: otlp-grpc.example.test
        run: |
          docker run --rm \
            -e ORBIT_OTLP_HTTP_DOMAIN -e ORBIT_OTLP_GRPC_DOMAIN \
            -v "$PWD/deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose -f docker-compose.yml -f deploy/production/compose.ingress.yaml --profile observability --profile production-ingress config --format json > /tmp/orbit-compose.json
          python3 - <<'PY'
          import json
          with open("/tmp/orbit-compose.json", encoding="utf-8") as handle:
              config = json.load(handle)
          services = config["services"]
          def published(service):
              return {int(port["target"]) for port in services[service].get("ports", [])}
          assert published("caddy") == {80, 443}, published("caddy")
          assert not ({4319, 4320} & published("api")), published("api")
          assert not published("otel-collector"), published("otel-collector")
          assert "ingress" in services["api"]["networks"]
          assert "ingress" in services["caddy"]["networks"]
          assert "default" not in services["caddy"]["networks"]
          assert "telemetry-internal" not in services["caddy"]["networks"]
          assert "ingress" not in services["postgres"]["networks"]
          assert "telemetry-internal" not in services["caddy"]["networks"]
          PY

      - name: Assert raw OTLP receivers are private-network-only
        run: python3 scripts/check_collector_network.py

      - name: Verify telemetry retention and cardinality guardrails
        run: python3 scripts/check_observability_limits.py

      - name: Start telemetry stack and instrumented demo
        run: docker compose --profile observability up -d prometheus loki tempo otel-collector telemetry-demo api

      - name: Wait for telemetry services on the private network
        run: docker compose --profile observability run --rm telemetry-smoke wait

      - name: Verify OTLP signals and ORBIT API query endpoints end to end
        run: docker compose --profile observability run --rm telemetry-smoke smoke

      - name: Verify Prometheus scrapes the ORBIT Collector
        run: docker compose --profile observability run --rm telemetry-smoke scrape

      - name: Verify authenticated workspace telemetry write-to-query isolation
        run: docker compose --profile observability run --rm workspace-tenant-isolation-smoke

      - name: Stop telemetry stack and demo
        if: always()
        run: docker compose --profile observability down -v --remove-orphans

  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check keyboard accessibility contract
        run: python3 scripts/check_accessibility_contract.py
      - name: Check theme text and focus contrast
        run: python3 scripts/check_accessibility_contrast.py

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Audit generated HTML accessibility structure
        run: python3 scripts/check_accessibility_html.py

      # Install exact test-only versions without changing the application's lockfile.
      - name: Install browser accessibility test dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1 @axe-core/playwright@4.14.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare the GitHub Pages base path for browser tests
        run: |
          mkdir -p .playwright-site/orbit
          cp -a out/. .playwright-site/orbit/

      - name: Run browser interaction and axe accessibility tests
        run: npx playwright test --config=playwright.config.cjs
