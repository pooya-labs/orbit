name: Deferred Production Identity Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-deferred-identity.yml"
      - "deploy/identity/**"
      - "deploy/keycloak/**"
      - "deploy/production/compose.ingress.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/security-deferred-identity.yml"
      - "deploy/identity/**"
      - "deploy/keycloak/**"
      - "deploy/production/compose.ingress.yaml"

permissions:
  contents: read

jobs:
  keycloak-image:
    name: Scan deferred Keycloak identity provider
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify the pinned Keycloak image includes linux/arm64
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect quay.io/keycloak/keycloak:26.8.2 | tee /tmp/keycloak-image-manifest.txt
          grep -Eq 'Platform:[[:space:]]+linux/arm64([[:space:]]|$)' /tmp/keycloak-image-manifest.txt

      - name: Inspect runtime packages related to the flagged findings
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh quay.io/keycloak/keycloak:26.8.2 -ec '
            echo "== Runtime package versions =="
            rpm -q ca-certificates java-21-openjdk-headless sqlite-libs || true
            echo "== SQLite command availability =="
            if command -v sqlite3 >/dev/null 2>&1; then sqlite3 --version; else echo "sqlite3 CLI is absent"; fi
            echo "== SQLite library and runtime references =="
            find /usr/lib64 /lib64 /opt/keycloak/lib -iname '*sqlite*' -print 2>/dev/null || true
            if command -v ldd >/dev/null 2>&1; then
              for path in /usr/bin /usr/sbin /usr/libexec /opt/keycloak/bin; do
                [ -d "$path" ] || continue
                for binary in $(find "$path" -type f -perm /111 2>/dev/null); do
                  if ldd "$binary" 2>/dev/null | grep -q "libsqlite3"; then
                    echo "SQLITE_LINKED_BINARY=$binary"
                  fi
                done
              done
            fi
            echo "== Guava jar and module references =="
            find /opt/keycloak/lib -type f -iname '*guava*' -print 2>/dev/null || true
            grep -R -n -E 'guava.*33\\.6\\.0|com\\.google\\.guava' /opt/keycloak/lib 2>/dev/null | head -30 || true
            echo "== Java trust store location and eMudhra aliases =="
            java_home="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.home = //p' | head -1)"
            echo "JAVA_HOME=$java_home"
            cacerts="$java_home/lib/security/cacerts"
            if [ -e "$cacerts" ]; then
              echo "CACERTS_REALPATH=$(readlink -f "$cacerts" 2>/dev/null || echo "$cacerts")"
              if command -v keytool >/dev/null 2>&1; then
                keytool -list -keystore "$cacerts" -storepass changeit 2>/dev/null | grep -i -E 'emSign|Comodo AAA' || echo "No matching eMudhra/Comodo aliases in Java trust store"
              else
                echo "keytool is absent"
              fi
            else
              echo "Java cacerts path not found"
            fi
          '

      - name: Export Keycloak package inventory for security triage
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/keycloak/keycloak:26.8.2
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: json
          output: /tmp/keycloak-trivy.json
          list-all-pkgs: true
          timeout: 10m

      - name: Report package versions relevant to current findings
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/keycloak-trivy.json").read_text())
          needles = ("ca-certificates", "sqlite", "openjdk", "guava")
          seen = set()
          for result in report.get("Results") or []:
              for package in result.get("Packages") or []:
                  name = str(package.get("Name") or "")
                  if any(needle in name.lower() for needle in needles):
                      item = (name, str(package.get("Version") or ""), str(package.get("PkgType") or ""))
                      if item not in seen:
                          seen.add(item)
                          print("PACKAGE_FULL " + json.dumps(package, sort_keys=True))
              for vuln in result.get("Vulnerabilities") or []:
                  vuln_id = str(vuln.get("VulnerabilityID") or "")
                  if vuln_id in {"CVE-2026-91403", "CVE-2026-119373", "CVE-2026-119586", "CVE-2026-102554"}:
                      print(
                          "FINDING",
                          vuln_id,
                          "package=", vuln.get("PkgName"),
                          "installed=", vuln.get("InstalledVersion"),
                          "fixed=", vuln.get("FixedVersion"),
                          "status=", vuln.get("Status"),
                      )
          if not seen:
              print("No matching packages were present in Trivy's package inventory; retain the full scan as the security gate.")
          PY

      - name: Scan the pinned Keycloak image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/keycloak/keycloak:26.8.2
          version: v0.76.1
          trivy-config: trivy.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          timeout: 10m

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate Keycloak CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/keycloak/keycloak:26.8.2
          version: v0.76.1
          trivy-config: trivy.yaml
          format: cyclonedx
          output: sbom/keycloak.cdx.json

      - name: Upload Keycloak SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-deferred-keycloak-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom/keycloak.cdx.json
          if-no-files-found: error
          retention-days: 30
