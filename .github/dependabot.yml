version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /examples/telemetry-go
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
