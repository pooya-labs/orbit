version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directories:
      - /server
      - /examples/telemetry-go
      - /scripts/telemetry-smoke
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /
      - /server
      - /examples/telemetry-go
      - /deploy/observability
      - /deploy/postgres
      - /deploy/production
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
