services:
  postgres:
    image: orbit-postgres:local
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - orbit-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ORBIT_HTTP_ADDR: ":8080"
      ORBIT_ENVIRONMENT: development
      ORBIT_VERSION: 0.10.0
      ORBIT_DATABASE_URL: postgres://orbit:orbit_local_only@postgres:5432/orbit?sslmode=disable
      ORBIT_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://pooya16pg-spec.github.io
      ORBIT_PROMETHEUS_URL: http://prometheus:9090
      ORBIT_LOKI_URL: http://loki:3100
      ORBIT_TEMPO_URL: http://tempo:3200
      ORBIT_INGESTION_HTTP_ADDR: ":4319"
      ORBIT_INGESTION_GRPC_ADDR: ":4320"
      ORBIT_COLLECTOR_OTLP_HTTP_URL: http://otel-collector:4318
      ORBIT_COLLECTOR_OTLP_GRPC_ENDPOINT: otel-collector:4317
      ORBIT_ALERT_WEBHOOK_ALLOWED_HOSTS: ${ORBIT_ALERT_WEBHOOK_ALLOWED_HOSTS:-}
      ORBIT_ALERT_WEBHOOK_SECRET_OPS_PRIMARY: ${ORBIT_ALERT_WEBHOOK_SECRET_OPS_PRIMARY:-}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - telemetry-internal
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    # Raw OTLP receivers are reachable only from the isolated Docker network.
    # The authenticated gateway will be the only production ingress path.
    networks:
      - telemetry-internal
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - orbit-prometheus-data:/prometheus
    networks:
      - telemetry-internal
    depends_on:
      otel-collector:
        condition: service_started

  loki:
    image: grafana/loki:3.7.9
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - orbit-loki-data:/loki
    networks:
      - telemetry-internal

  tempo:
    image: grafana/tempo:3.1.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - orbit-tempo-data:/var/tempo
    networks:
      - telemetry-internal

  telemetry-demo:
    build:
      context: ./examples/telemetry-go
      dockerfile: Dockerfile
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - telemetry-internal
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  workspace-tenant-isolation-smoke:
    image: golang:1.27-alpine
    profiles: ["observability"]
    working_dir: /workspace
    command:
      - go
      - test
      - ./internal/ingest
      - -run
      - ^TestWorkspaceOTLPWriteToQueryIsolation$
      - -count=1
      - -v
    environment:
      ORBIT_TEST_DATABASE_URL: postgres://orbit:orbit_local_only@postgres:5432/orbit?sslmode=disable
      ORBIT_TEST_COLLECTOR_OTLP_HTTP_URL: http://otel-collector:4318
      ORBIT_TEST_PROMETHEUS_URL: http://prometheus:9090
      ORBIT_TEST_LOKI_URL: http://loki:3100
      ORBIT_TEST_TEMPO_URL: http://tempo:3200
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=readonly
    volumes:
      - ./server:/workspace:ro
    networks:
      - default
      - telemetry-internal
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  telemetry-smoke:
    image: orbit-telemetry-smoke:local
    build:
      context: .
      dockerfile: deploy/observability/telemetry-smoke.Dockerfile
    profiles: ["observability"]
    networks:
      - telemetry-internal
    depends_on:
      otel-collector:
        condition: service_started
      telemetry-demo:
        condition: service_started
      api:
        condition: service_started

networks:
  telemetry-internal:
    # No host/external attachment: OTLP receivers and backend APIs stay private.
    internal: true

volumes:
  orbit-postgres-data:
  orbit-redis-data:
  orbit-prometheus-data:
  orbit-loki-data:
  orbit-tempo-data:
