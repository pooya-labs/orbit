<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORBIT — Interactive Demo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background: #070b12; color: #e8eef8; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header { height: 48px; flex: 0 0 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid #1c2938; background: #0b111b; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    .mark { width: 9px; height: 9px; border-radius: 3px; background: #00e6d0; box-shadow: 0 0 14px #00e6d077; transform: rotate(45deg); }
    .demo { color: #7dd3c7; border: 1px solid #245b58; background: #0c2425; border-radius: 999px; padding: 5px 9px; font-size: 10px; letter-spacing: .06em; }
    main { flex: 1 1 auto; min-height: 0; position: relative; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #070b12; }
    #status { position: fixed; z-index: 2; right: 16px; bottom: 12px; color: #8c9aac; background: #0b111bdd; border: 1px solid #263547; border-radius: 8px; padding: 6px 9px; font-size: 11px; pointer-events: none; }
    @media (max-width: 640px) { header { height: 42px; flex-basis: 42px; padding: 0 12px; } .brand { font-size: 10px; } #status { right: 8px; bottom: 8px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>ORBIT OBSERVABILITY</span></div>
    <span class="demo">PUBLIC DEMO · SYNTHETIC DATA</span>
  </header>
  <main>
    <iframe id="orbit-frame" title="ORBIT observability demo" src="<?= appUrl ?>"
      referrerpolicy="no-referrer" allow="clipboard-read; clipboard-write"></iframe>
  </main>
  <div id="status" role="status" aria-live="polite">Connecting demo workspace…</div>
  <script>
    (function () {
      "use strict";
      var ORBIT_ORIGIN = "https://pooya-labs.github.io";
      var frame = document.getElementById("orbit-frame");
      var status = document.getElementById("status");
      var bootstrapping = false;
      var ready = false;
      function setStatus(message) { status.textContent = message; }
      function postToFrame(message) {
        if (frame.contentWindow) frame.contentWindow.postMessage(message, ORBIT_ORIGIN);
      }
      window.addEventListener("message", function (event) {
        if (event.origin !== ORBIT_ORIGIN || event.source !== frame.contentWindow) return;
        var message = event.data;
        if (!message || typeof message !== "object") return;
        if (message.type === "ORBIT_BRIDGE_HELLO") {
          if (bootstrapping || typeof message.clientId !== "string") return;
          bootstrapping = true;
          setStatus("Preparing your isolated demo workspace…");
          google.script.run
            .withSuccessHandler(function (payload) {
              ready = true;
              setStatus("Connected · isolated demo workspace");
              postToFrame({ type: "ORBIT_BRIDGE_INIT", payload: payload });
            })
            .withFailureHandler(function (error) {
              var message = error && typeof error.message === "string"
                ? error.message
                : "The demo workspace could not be prepared. Reload this page.";
              setStatus(message);
              postToFrame({ type: "ORBIT_BRIDGE_INIT_ERROR", message: message });
            })
            .orbitBootstrap(message.clientId);
          return;
        }
        if (message.type === "ORBIT_BRIDGE_REQUEST") {
          if (!ready || typeof message.id !== "string" || !message.request) return;
          var request = message.request;
          if (JSON.stringify(request).length > 22000) {
            postToFrame({ type: "ORBIT_BRIDGE_RESPONSE", id: message.id, response: {
              status: 413, body: { error: { code: "request_too_large", message: "The demo request is too large.", request_id: "wrapper" } }
            }});
            return;
          }
          request.sessionToken = message.sessionToken;
          google.script.run
            .withSuccessHandler(function (response) {
              postToFrame({ type: "ORBIT_BRIDGE_RESPONSE", id: message.id, response: response });
            })
            .withFailureHandler(function () {
              postToFrame({ type: "ORBIT_BRIDGE_RESPONSE", id: message.id, response: {
                status: 503, body: { error: { code: "demo_unavailable", message: "The demo service is temporarily unavailable.", request_id: "wrapper" } }
              }});
            })
            .orbitApi(request);
        }
      });
      window.addEventListener("beforeunload", function () { ready = false; bootstrapping = false; });
    }());
  </script>
</body>
</html>
